<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash === '#still';
const canvas = document.getElementById('gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); } catch (e) { document.documentElement.classList.add('no3d'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x060708, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1c20);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
camera.position.set(0, 1.2, 30); camera.lookAt(0, 0.6, 0);

// ---- colour: APEX hologram = platinum-white light with a faint ice tint (hologram-3d-object §4)
// Tyson 15 Nov: GOLD hologram, the APEX DESK liquid chrome-gold (liquid-chrome-gold ramp: body #f0e6c7, edges #fef9e8, cone bronze #a4845d)
const HOLO = new THREE.Color(0xc29a5e), EDGE = new THREE.Color(0xf0e2bb), BEAM = new THREE.Color(0xf6e2b0), CONE = new THREE.Color(0xa4845d);

// ---- geometry: the FLARE CUT A, exact (marks.json from build_logo.py)
const D = window.__marks.glint;
const toShapes = list => list.map(p => {
  const v = ([x, y]) => new THREE.Vector2(x - 50, 50 - y);
  let o = p.o.map(v); if (THREE.ShapeUtils.isClockWise(o)) o.reverse();
  const s = new THREE.Shape(o);
  p.h.forEach(h => { let hh = h.map(v); if (!THREE.ShapeUtils.isClockWise(hh)) hh.reverse(); s.holes.push(new THREE.Path(hh)); });
  return s; });
const extrude = (list, depth, bevel, z = 0) => {
  let g = new THREE.ExtrudeGeometry(toShapes(list), { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * .7,
    bevelOffset: -bevel * .35, bevelSegments: 4, curveSegments: 10 });
  g = toCreasedNormals(g, Math.PI / 4.5); g.translate(0, 0, -depth / 2 + z); return g; };
const faceGeo = extrude(D.face, 7, 1.0), beamGeo = extrude(D.chrome, 2.4, .5, 2.6);

// ---- hologram shader (hologram-3d-object §2)
const U = { uT: { value: 0 }, uGlitch: { value: 0 } };
const holoMat = (color, base = .07, gain = 1.35) => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false,
  uniforms: { uT: U.uT, uGlitch: U.uGlitch, uColor: { value: color }, uBase: { value: base }, uGain: { value: gain } },
  vertexShader: `uniform float uT, uGlitch; varying vec3 vN, vV, vW;
    void main(){ vec3 p = position;
      float slice = step(.86, fract(sin(floor(p.y * .22 + floor(uT * 14.)) * 91.7) * 437.5));
      p.x += uGlitch * slice * 5.0 * sin(uT * 70.);
      vec4 w = modelMatrix * vec4(p, 1.); vW = w.xyz;
      vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - w.xyz);
      gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uT, uBase, uGain; uniform vec3 uColor; varying vec3 vN, vV, vW;
    void main(){ float fr = pow(1. - abs(dot(normalize(vN), normalize(vV))), 2.2);
      float scan = .82 + .18 * sin(gl_FragCoord.y * 2.1 - uT * 4.);
      float band = smoothstep(.07, 0., abs(fract(vW.y * .09 - uT * .16) - .5) - .0);
      float flick = 1. - .05 * step(.62, sin(uT * 31.) * sin(uT * 7.3));
      float a = (uBase + fr * (1. - uBase)) * scan * flick + band * .28;
      gl_FragColor = vec4(uColor * a * uGain, a); }` });

const holo = new THREE.Group(); scene.add(holo);
const S = 0.1;                                  // mark units -> scene
const A = new THREE.Group(); A.scale.setScalar(S); holo.add(A);
A.add(new THREE.Mesh(faceGeo, holoMat(HOLO)));
const edgeMat = new THREE.LineBasicMaterial({ color: EDGE, transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
const edgeSoft = edgeMat.clone(); edgeSoft.opacity = .22;
const eg = new THREE.EdgesGeometry(faceGeo, 25);
A.add(new THREE.LineSegments(eg, edgeMat));
const e2 = new THREE.LineSegments(eg, edgeSoft); e2.scale.setScalar(1.012); A.add(e2);
// the FLARE CUT beam: the brightest thing, pure light
const beamMat = new THREE.MeshBasicMaterial({ color: BEAM, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
beamMat.color.multiplyScalar(1.6);
A.add(new THREE.Mesh(beamGeo, beamMat));
A.add(new THREE.LineSegments(new THREE.EdgesGeometry(beamGeo, 25), edgeMat));

// ---- projector: emitter ring, light cone, dust, floor pool (hologram-3d-object §1.5)
const BASE_Y = -5.6;
const proj = new THREE.Group(); proj.position.y = BASE_Y; scene.add(proj);
const ringMat = new THREE.MeshBasicMaterial({ color: HOLO, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
const ring = new THREE.Mesh(new THREE.RingGeometry(2.3, 2.42, 96), ringMat); ring.rotation.x = -Math.PI / 2; proj.add(ring);
const ring2 = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.26, 96), ringMat.clone()); ring2.material.opacity = .6; ring2.rotation.x = -Math.PI / 2; proj.add(ring2);
// matte base disc so the projector reads as an object (matte-material)
const disc = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.8, .35, 96), new THREE.MeshStandardMaterial({ color: 0x141518, roughness: .6, metalness: .5 }));
disc.position.y = -.2; proj.add(disc);
scene.add(new THREE.HemisphereLight(0x9fb3c8, 0x050506, .35));
const coneMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false,
  uniforms: { uColor: { value: CONE }, uT: U.uT },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 uColor; uniform float uT; varying vec2 vUv;
    void main(){ float a = pow(1. - vUv.y, 2.2) * .07; a *= .85 + .15 * sin(vUv.x * 40. + uT * .7); gl_FragColor = vec4(uColor * a, a); }` });
const cone = new THREE.Mesh(new THREE.CylinderGeometry(5.8, 2.3, 11.5, 96, 1, true), coneMat); cone.position.y = 5.75; proj.add(cone);
// dust in the beam
const N = 260, dp = new Float32Array(N * 3), seeds = new Float32Array(N);
for (let i = 0; i < N; i++) { const r = Math.sqrt(Math.random()) * 3.6, a = Math.random() * 6.283; dp[i*3] = Math.cos(a) * r; dp[i*3+1] = Math.random() * 11; dp[i*3+2] = Math.sin(a) * r; seeds[i] = Math.random(); }
const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
const dust = new THREE.Points(dg, new THREE.PointsMaterial({ color: HOLO, size: .045, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
proj.add(dust);
// floor light pool
const pc = document.createElement('canvas'); pc.width = pc.height = 128; const px = pc.getContext('2d');
const pg = px.createRadialGradient(64, 64, 0, 64, 64, 64); pg.addColorStop(0, 'rgba(240,230,199,.26)'); pg.addColorStop(.4, 'rgba(164,132,93,.07)'); pg.addColorStop(1, 'rgba(164,132,93,0)');
px.fillStyle = pg; px.fillRect(0, 0, 128, 128);
const pool = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(pc), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
pool.rotation.x = -Math.PI / 2; pool.position.y = -.38; proj.add(pool);

// ---- bloom (hologram-3d-object §3)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .4, .18, .72); composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---- motion (hologram-3d-object §5)
const pointer = { x: 0, y: 0 };
addEventListener('pointermove', e => { pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = e.clientY / innerHeight * 2 - 1; }, { passive: true });
const damp = (c, t, l, dt) => c + (t - c) * (1 - Math.exp(-l * dt));
let ry = -0.24, rx = 0, t = 0, last = performance.now(), nextGlitch = 4, glitchEnd = 0;
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w, h);
  camera.aspect = w / h; camera.position.z = w / h < .8 ? 44 : 30; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function frame(now) {
  const dt = Math.min(Math.max((now - last) / 1000, 0), 1 / 15); last = now;
  if (!REDUCED) t += dt;
  U.uT.value = t;
  if (!REDUCED && t > nextGlitch) { glitchEnd = t + .16; nextGlitch = t + 6 + Math.random() * 4; }
  U.uGlitch.value = t < glitchEnd ? 1 : 0;
  const turn = REDUCED ? 0 : t * (Math.PI * 2 / 12);             // one slow turn every 12 s
  ry = damp(ry, -0.24 + turn + pointer.x * .35, 4, dt); rx = damp(rx, pointer.y * .12, 4, dt);
  holo.rotation.set(rx, ry, 0);
  holo.position.y = 1.0 + (REDUCED ? 0 : Math.sin(t * .9) * .12);
  ring.material.opacity = .85 + .15 * Math.sin(t * 2.3);
  const pos = dg.attributes.position.array;
  if (!REDUCED) for (let i = 0; i < N; i++) { pos[i*3+1] += dt * (.25 + seeds[i] * .45); if (pos[i*3+1] > 11) pos[i*3+1] = 0; }
  dg.attributes.position.needsUpdate = true;
  dust.rotation.y = t * .05;
  composer.render();
  if (!REDUCED) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__holo = { get t() { return t; } };
