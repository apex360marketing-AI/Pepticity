<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTN-102 · SHARD CORNERS</title>
<!--@meta {"order":15,"code":"BTN-102","name":"SHARD CORNERS","interact":"hover","weight":"Light",
 "desc":"A plain glass bar until you point at it: two corners break off as small shards of glass that float away, leaving the PEPTICITY cut corners with a line of light along each cut. They fly back when you leave.",
 "source":"APEX library BTN-102 Shard Corners (corner pieces break off as shards), re-cut so the shards reveal the PEPTICITY chamfer"}-->
<!--@head-->
<style>
.sh{--c:24px;--shc:var(--acc);position:relative;display:inline-grid;place-items:center;height:78px;min-width:330px;margin:0;padding:0;border:0;background:none;cursor:pointer;color:var(--ink);
  font:400 13.5px/1 var(--fh);letter-spacing:.3em;text-transform:uppercase;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.sh.sec{--c:20px;--shc:#e6e8ec;height:66px;min-width:270px;font-size:12px}
.sh:focus{outline:none}
.sh-g{position:absolute;inset:0;transition:transform var(--d1) var(--e-out)}
.sh-g.pg{--c:24px}.sh.sec .sh-g.pg{--c:20px}
.sh:active .sh-g{transform:scale(.985)}
.sh-l{position:relative;z-index:3;display:inline-flex;align-items:center;gap:14px;padding:0 50px;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.sh-l b{font-weight:400;width:7px;height:7px;transform:rotate(45deg);border-top:1.6px solid var(--shc);border-right:1.6px solid var(--shc);transition:transform .5s var(--e-out)}
.sh.hot .sh-l b{transform:translateX(5px) rotate(45deg)}
/* the corner boxes: shards tile the cut-away triangle until the pointer arrives */
.cn{position:absolute;width:var(--c);height:var(--c);z-index:2;pointer-events:none}
.cn.tl{left:0;top:0}.cn.br{right:0;bottom:0;transform:rotate(180deg)}
.cn::before,.cn::after{content:"";position:absolute;left:0;top:0;background:rgba(236,240,245,.6);transition:opacity .3s}
.cn::before{width:100%;height:1px}.cn::after{width:1px;height:100%}
.cn.br::before{background:rgba(120,127,137,.5)}.cn.br::after{background:rgba(120,127,137,.5)}
.sh.hot .cn::before,.sh.hot .cn::after{opacity:0}
.cn i{position:absolute;inset:0;-webkit-backdrop-filter:blur(12px) saturate(165%);backdrop-filter:blur(12px) saturate(165%);
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.03));clip-path:var(--p);
  transition:transform .55s var(--e-spring),opacity .4s;transition-delay:calc(var(--dl) * .6)}
.sh.hot .cn i{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.7);opacity:0;transition:transform .7s var(--e-out),opacity .6s .1s;transition-delay:var(--dl)}
.sh.burst .cn i{transform:translate(calc(var(--dx) * 2),calc(var(--dy) * 2)) rotate(calc(var(--rot) * 2)) scale(.5);opacity:0;transition-duration:.4s;transition-delay:0s}
/* the light along each cut, drawn once the shards have gone */
.cut{position:absolute;width:calc(var(--c) * 1.4142);height:1.5px;z-index:3;pointer-events:none;transform-origin:0 50%;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--shc) 70%,#fff) 30%,#fff 50%,color-mix(in srgb,var(--shc) 70%,#fff) 70%,transparent);
  box-shadow:0 0 8px var(--shc),0 0 16px color-mix(in srgb,var(--shc) 50%,transparent);opacity:0;transition:opacity .4s,transform .5s var(--e-out)}
.cut.a{left:0;top:var(--c);transform:rotate(-45deg) scaleX(0)}
.cut.b{right:0;bottom:var(--c);transform-origin:100% 50%;transform:rotate(-45deg) scaleX(0)}
.sh.hot .cut{opacity:1;transition-delay:.25s}
.sh.hot .cut.a{transform:rotate(-45deg) scaleX(1)}.sh.hot .cut.b{transform:rotate(-45deg) scaleX(1)}
.sh .pm-lit{--lit:var(--shc)}
.sh.hot .pm-lit,.sh:focus-visible .pm-lit{opacity:.4}
.sh-ring{position:absolute;inset:-7px;pointer-events:none;opacity:0;--k:28px;clip-path:polygon(var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k));
  background:linear-gradient(var(--acc-text),var(--acc-text)) 0 0/100% 2px no-repeat,linear-gradient(var(--acc-text),var(--acc-text)) 0 100%/100% 2px no-repeat,linear-gradient(var(--acc-text),var(--acc-text)) 0 0/2px 100% no-repeat,linear-gradient(var(--acc-text),var(--acc-text)) 100% 0/2px 100% no-repeat}
.sh:focus-visible .sh-ring{opacity:1}
@media (max-width:520px),(max-height:480px){.sh{height:68px;min-width:270px;font-size:12px;letter-spacing:.24em}.sh.sec{height:58px;min-width:220px;font-size:11px}.sh-l{padding:0 36px}}
@media (prefers-reduced-motion:reduce){.cn i,.cut{transition-duration:.01s!important;transition-delay:0s!important}.sh.hot .cn i{transform:none}}
</style>
</head>
<body data-code="BTN-102" data-name="SHARD CORNERS" data-hint="HOVER">
<!--@stage-->
<main class="pm-main">
  <section class="pm-duo" aria-label="Button states">
    <figure class="pm-cell is-primary">
      <figcaption class="pm-cap">PRIMARY</figcaption>
      <button class="sh pri" type="button"><span class="pm-lit" aria-hidden="true"><i></i></span><span class="sh-g pg" aria-hidden="true"></span><span class="cn tl" aria-hidden="true"></span><span class="cn br" aria-hidden="true"></span><span class="cut a" aria-hidden="true"></span><span class="cut b" aria-hidden="true"></span><span class="sh-l">CONTINUE<b aria-hidden="true"></b></span><span class="sh-ring" aria-hidden="true"></span></button>
    </figure>
    <figure class="pm-cell">
      <figcaption class="pm-cap">SECONDARY</figcaption>
      <button class="sh sec" type="button"><span class="pm-lit" aria-hidden="true"><i></i></span><span class="sh-g pg" aria-hidden="true"></span><span class="cn tl" aria-hidden="true"></span><span class="cn br" aria-hidden="true"></span><span class="cut a" aria-hidden="true"></span><span class="cut b" aria-hidden="true"></span><span class="sh-l">GO BACK</span><span class="sh-ring" aria-hidden="true"></span></button>
    </figure>
  </section>
</main>
<!--@tail-->
<script>
(function(){
  /* the cut-away triangle (0,0)-(c,0)-(0,c), broken into five shards; each flies out away from the glass */
  var S=[['0 0','52% 0','0 48%'],['52% 0','100% 0','46% 46%'],['0 48%','46% 46%','0 100%'],['52% 0','46% 46%','0 48%'],['20% 0','52% 0','30% 22%']];
  var F=[[-30,-22,-80],[10,-34,70],[-34,14,-60],[-18,-14,120],[-6,-38,-140]];
  document.querySelectorAll('.sh').forEach(function(el){
    el.querySelectorAll('.cn').forEach(function(cn,k){
      cn.innerHTML=S.map(function(p,i){var f=F[i];return '<i style="--p:polygon('+p.join(',')+');--dx:'+f[0]+'px;--dy:'+f[1]+'px;--rot:'+f[2]+'deg;--dl:'+(i*45+k*30)+'ms"></i>'}).join('');
    });
    var on=function(){el.classList.add('hot')},off=function(){el.classList.remove('hot','burst')};
    el.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')on()});el.addEventListener('pointerleave',off);
    el.addEventListener('focus',function(){if(el.matches(':focus-visible'))on()});el.addEventListener('blur',off);
    el.addEventListener('pointerdown',function(e){el.classList.add('burst');if(e.pointerType!=='mouse'){on();setTimeout(off,1300)}});
    el.addEventListener('pointerup',function(){el.classList.remove('burst')});
  });
  /* idle demo while playing: the corners break off and return, one button at a time */
  var els=[].slice.call(document.querySelectorAll('.sh')),acc=2,i=0,touched=false;document.addEventListener('pointermove',function(){touched=true},{once:true});
  PM.ambient(function(dt){if(touched)return;acc+=dt;if(acc>5){acc=0;var el=els[i++%els.length];el.classList.add('hot');setTimeout(function(){if(!touched)el.classList.remove('hot')},1700)}});
})();
</script>
</body>
</html>
