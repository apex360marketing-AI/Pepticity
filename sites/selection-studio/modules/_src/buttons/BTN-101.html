<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTN-101 · TORN STUB</title>
<!--@meta {"order":9,"code":"BTN-101","name":"TORN STUB","interact":"tap","weight":"Medium",
 "desc":"A glass ticket with a dotted tear line and a stub carrying the P. Point at it and the stub lifts; click and the stub tears off with a ragged edge, then a fresh one drops back in.",
 "source":"APEX library BTN-101 Torn Stub (lift on hover, tear on click, return), re-cut as a PEPTICITY glass ticket with the approved P"}-->
<!--@head-->
<!--@pmark-->
<style>
.tk{--c:14px;--n:8px;--tc:var(--acc);position:relative;display:inline-flex;height:78px;margin:0;padding:0;border:0;background:none;cursor:pointer;color:var(--ink);
  font:400 13.5px/1 var(--fh);letter-spacing:.3em;text-transform:uppercase;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;filter:drop-shadow(0 16px 22px rgba(0,0,0,.5))}
.tk.sec{--c:12px;--tc:#c9cdd4;height:66px;font-size:12px}
.tk:focus{outline:none}
.tk-main,.tk-stub{position:relative;display:flex;align-items:center;justify-content:center;height:100%;
  -webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);
  background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 46%),linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.015));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(120,127,137,.5)}
.tk-main{padding:0 44px 0 50px;white-space:nowrap;
  clip-path:polygon(var(--c) 0,100% 0,100% 100%,0 100%,0 var(--c));
  -webkit-mask:radial-gradient(circle at 100% 0,transparent var(--n),#000 calc(var(--n) + .5px)),radial-gradient(circle at 100% 100%,transparent var(--n),#000 calc(var(--n) + .5px));
  -webkit-mask-composite:source-in;mask:radial-gradient(circle at 100% 0,transparent var(--n),#000 calc(var(--n) + .5px)) intersect,radial-gradient(circle at 100% 100%,transparent var(--n),#000 calc(var(--n) + .5px))}
.tk-main::before{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(236,240,245,.32);border-right:0;clip-path:inherit}
.tk-stub{width:92px;flex:none;flex-direction:column;gap:7px;transform-origin:0 100%;transition:transform .55s var(--e-spring),opacity .3s;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%);
  -webkit-mask:radial-gradient(circle at 0 0,transparent var(--n),#000 calc(var(--n) + .5px)),radial-gradient(circle at 0 100%,transparent var(--n),#000 calc(var(--n) + .5px));
  -webkit-mask-composite:source-in;mask:radial-gradient(circle at 0 0,transparent var(--n),#000 calc(var(--n) + .5px)) intersect,radial-gradient(circle at 0 100%,transparent var(--n),#000 calc(var(--n) + .5px))}
.tk.sec .tk-stub{width:76px}
.tk-stub::before{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(236,240,245,.32);border-left:0}
.tk-stub svg{width:30px;height:24px;overflow:visible}
.tk-stub svg use{fill:url(#gun)}
.tk-stub small{font:400 8px/1 var(--fh);letter-spacing:.3em;color:var(--mute)}
.tk-stub .arr{font:400 18px/1 var(--fb);color:var(--ink2)}
.tk-perf{position:absolute;top:calc(var(--n) + 4px);bottom:calc(var(--n) + 4px);width:1.5px;margin-left:-.75px;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(230,234,240,.55) 0 3px,transparent 3px 7px);transition:filter .4s,background .4s}
.tk.hot .tk-perf{background:repeating-linear-gradient(180deg,var(--tc) 0 3px,transparent 3px 7px);filter:drop-shadow(0 0 3px var(--tc))}
.tk-l{position:relative;z-index:2;display:grid;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.tk-l span{grid-area:1/1;transition:transform .45s var(--e-out),opacity .3s}
.tk-l span+span{opacity:0;transform:translateY(60%);color:var(--tc);display:flex;align-items:center;gap:12px;justify-content:center}
.tk.sec .tk-l span+span{color:#fff}
.tk-l span+span svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tk.done .tk-l span:first-child{opacity:0;transform:translateY(-60%)}
.tk.done .tk-l span+span{opacity:1;transform:none}
/* hover: the stub lifts at its tear line */
.tk.hot .tk-stub{transform:rotate(-5deg) translate(2px,-3px)}
/* tear: ragged edge, then the stub falls away; a fresh one drops back in */
.tk.tear .tk-stub{clip-path:polygon(0 0,5px 7%,0 14%,6px 21%,1px 29%,5px 36%,0 43%,6px 50%,1px 57%,5px 64%,0 71%,6px 79%,1px 86%,5px 93%,0 100%,calc(100% - var(--c)) 100%,100% calc(100% - var(--c)),100% 0);
  transform:translate(56px,38px) rotate(24deg);opacity:0;transition:transform .8s var(--e-in),opacity .7s .1s}
.tk.back .tk-stub{transition:none;transform:translateY(-34px) rotate(-4deg);opacity:0}
.tk.tear .tk-main{clip-path:polygon(var(--c) 0,100% 0,calc(100% - 5px) 8%,100% 16%,calc(100% - 6px) 24%,100% 32%,calc(100% - 4px) 40%,100% 48%,calc(100% - 6px) 56%,100% 64%,calc(100% - 4px) 72%,100% 80%,calc(100% - 6px) 88%,100% 100%,0 100%,0 var(--c))}
.tk.tear .tk-perf{opacity:0}
.tk .pm-lit{--lit:var(--tc);--lc:var(--c)}
.tk.hot .pm-lit{opacity:.45}
.tk-ring{position:absolute;inset:-7px;pointer-events:none;opacity:0;--k:18px;clip-path:polygon(var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k));
  background:linear-gradient(var(--acc-text),var(--acc-text)) 0 0/100% 2px no-repeat,linear-gradient(var(--acc-text),var(--acc-text)) 0 100%/100% 2px no-repeat,linear-gradient(var(--acc-text),var(--acc-text)) 0 0/2px 100% no-repeat,linear-gradient(var(--acc-text),var(--acc-text)) 100% 0/2px 100% no-repeat}
.tk:focus-visible .tk-ring{opacity:1}
@media (max-width:520px),(max-height:480px){.tk{height:68px;font-size:12px;letter-spacing:.24em}.tk-main{padding:0 30px 0 36px}.tk-stub{width:76px}.tk.sec{height:60px;font-size:11px}.tk.sec .tk-stub{width:64px}}
@media (prefers-reduced-motion:reduce){.tk-stub,.tk-l span{transition:none!important}.tk.tear .tk-stub{transform:none;opacity:.25}}
</style>
</head>
<body data-code="BTN-101" data-name="TORN STUB" data-hint="PRESS">
<!--@stage-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3a29b"/><stop offset=".46" stop-color="#6b6a64"/><stop offset=".54" stop-color="#2a2a28"/><stop offset="1" stop-color="#8e8d85"/></linearGradient></defs></svg>
<main class="pm-main">
  <section class="pm-duo" aria-label="Button states">
    <figure class="pm-cell is-primary">
      <figcaption class="pm-cap">PRIMARY</figcaption>
      <button class="tk pri" type="button" aria-label="SAVE MY SPOT"><span class="pm-lit" aria-hidden="true"><i></i></span>
        <span class="tk-main"><span class="tk-l" aria-hidden="true"><span>SAVE MY SPOT</span><span><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>SAVED</span></span></span>
        <span class="tk-perf" aria-hidden="true"></span>
        <span class="tk-stub" aria-hidden="true"><svg viewBox="0 0 1.416 1.16"><use href="#pmark"/></svg><small>NO. 01</small></span>
        <span class="tk-ring" aria-hidden="true"></span></button>
    </figure>
    <figure class="pm-cell">
      <figcaption class="pm-cap">SECONDARY</figcaption>
      <button class="tk sec" type="button" aria-label="KEEP BROWSING"><span class="pm-lit" aria-hidden="true"><i></i></span>
        <span class="tk-main"><span class="tk-l" aria-hidden="true"><span>KEEP BROWSING</span><span>OK</span></span></span>
        <span class="tk-perf" aria-hidden="true"></span>
        <span class="tk-stub" aria-hidden="true"><span class="arr">&rarr;</span></span>
        <span class="tk-ring" aria-hidden="true"></span></button>
    </figure>
  </section>
</main>
<!--@tail-->
<script>
(function(){
  document.querySelectorAll('.tk').forEach(function(el){
    var perf=el.querySelector('.tk-perf'),main=el.querySelector('.tk-main'),busy=false;
    function place(){perf.style.left=main.offsetWidth+'px'}
    place();addEventListener('resize',place);if(document.fonts)document.fonts.ready.then(place);
    var on=function(){el.classList.add('hot')},off=function(){el.classList.remove('hot')};
    el.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')on()});el.addEventListener('pointerleave',off);
    el.addEventListener('focus',function(){if(el.matches(':focus-visible'))on()});el.addEventListener('blur',off);
    el.addEventListener('click',function(){
      if(busy)return;busy=true;el.classList.remove('hot');el.classList.add('tear','done');
      setTimeout(function(){el.classList.remove('tear');el.classList.add('back');void el.offsetWidth;
        requestAnimationFrame(function(){el.classList.remove('back')})},PM.RM?600:950);
      setTimeout(function(){el.classList.remove('done');busy=false;if(el.matches(':hover'))on()},PM.RM?1400:2300);
    });
  });
})();
</script>
</body>
</html>
