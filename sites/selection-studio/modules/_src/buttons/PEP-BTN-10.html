<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEP-BTN-10 · CHECK MORPH</title>
<!--@meta {"order":10,"code":"PEP-BTN-10","name":"CHECK MORPH","interact":"tap","weight":"Medium",
 "desc":"Press ADD TO CART and the glass folds in to a small square, a light circles while it works, then it fills with your colour and a check mark draws itself before it opens back out.",
 "source":"New for PEPTICITY (Selection Studio library B), after the dashboard submit morph; BTN-P01 glass and chamfer"}-->
<!--@head-->
<style>
@property --l{syntax:'<length>';inherits:true;initial-value:0px}
@property --r{syntax:'<length>';inherits:true;initial-value:0px}
.mor{--c:16px;--fc:var(--acc);--fi:var(--acc-ink);position:relative;display:inline-grid;place-items:center;height:76px;min-width:330px;margin:0;padding:0;border:0;background:none;cursor:pointer;color:var(--ink);
  font:400 13.5px/1 var(--fh);letter-spacing:.3em;text-transform:uppercase;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.mor.sec{--c:13px;--fc:#e6e8ec;--fi:#0b0b0c;height:64px;min-width:290px;font-size:12px}
.mor:focus{outline:none}
.mor-shape{position:absolute;inset:0;--l:0px;--r:0px;transition:--l .5s var(--e-io),--r .5s var(--e-io)}
.mor[data-s="busy"] .mor-shape,.mor[data-s="done"] .mor-shape{--l:var(--k);--r:var(--k)}
.mor[data-s="open"] .mor-shape{transition-duration:.6s}
.mor-glass,.mor-fill,.mor-rim{position:absolute;inset:0;
  clip-path:polygon(calc(var(--l) + var(--c)) 0,calc(100% - var(--r)) 0,calc(100% - var(--r)) calc(100% - var(--c)),calc(100% - var(--r) - var(--c)) 100%,var(--l) 100%,var(--l) var(--c))}
.mor-glass{-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 46%),linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.012))}
.mor-rim{background:linear-gradient(180deg,rgba(244,246,250,.8),rgba(200,207,216,.4) 50%,rgba(120,127,137,.5));
  clip-path:polygon(evenodd,calc(var(--l) + var(--c)) 0,calc(100% - var(--r)) 0,calc(100% - var(--r)) calc(100% - var(--c)),calc(100% - var(--r) - var(--c)) 100%,var(--l) 100%,var(--l) var(--c),calc(var(--l) + var(--c)) 0,
    calc(var(--l) + var(--c) + .4px) 1px,calc(100% - var(--r) - 1px) 1px,calc(100% - var(--r) - 1px) calc(100% - var(--c) - .4px),calc(100% - var(--r) - var(--c) - .4px) calc(100% - 1px),calc(var(--l) + 1px) calc(100% - 1px),calc(var(--l) + 1px) calc(var(--c) + .4px),calc(var(--l) + var(--c) + .4px) 1px)}
.mor-fill{background:radial-gradient(80% 80% at 40% 20%,color-mix(in srgb,var(--fc) 70%,#fff),var(--fc) 55%,color-mix(in srgb,var(--fc) 72%,#000));opacity:0;transition:opacity .35s var(--e-out)}
.mor[data-s="done"] .mor-fill{opacity:.95}
.mor[data-s="open"] .mor-fill{opacity:.16;transition-duration:1.4s}
.mor:active .mor-shape{transform:scale(.97);transition:transform .12s,--l .5s var(--e-io),--r .5s var(--e-io)}
.mor-shape{transition:transform .5s var(--e-spring),--l .5s var(--e-io),--r .5s var(--e-io)}
/* label states */
.mor-l{position:relative;z-index:2;display:grid;place-items:center;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.mor-l>span{grid-area:1/1;display:inline-flex;align-items:center;gap:14px;white-space:nowrap;padding:0 46px;transition:transform .4s var(--e-out),opacity .25s}
.mor-l svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mor-l .b{opacity:0;transform:translateY(40%)}
.mor-l .b svg{stroke:var(--fc);stroke-width:2.2}
.mor.sec .mor-l .b svg{stroke:#fff}
.mor[data-s="busy"] .mor-l .a,.mor[data-s="done"] .mor-l .a{opacity:0;transform:translateY(-40%) scale(.9)}
.mor[data-s="open"] .mor-l .a{opacity:0;transform:translateY(-40%)}
.mor[data-s="open"] .mor-l .b{opacity:1;transform:none;transition-delay:.25s}
/* working: two cut-corner brackets circle the square */
.mor-spin{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;z-index:3;opacity:0;transition:opacity .2s}
.mor.sec .mor-spin{width:34px;height:34px;margin:-17px 0 0 -17px}
.mor-spin i{position:absolute;inset:0;animation:morSpin .9s linear infinite}
.mor-spin i::before,.mor-spin i::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--fc);filter:drop-shadow(0 0 4px var(--fc))}
.mor-spin i::before{left:0;top:0;border-right:0;border-bottom:0}
.mor-spin i::after{right:0;bottom:0;border-left:0;border-top:0}
.mor[data-s="busy"] .mor-spin{opacity:1;transition-delay:.35s}
@keyframes morSpin{to{transform:rotate(360deg)}}
/* done: the check draws itself (clip-path reveal, left to right) + a ring bursts out */
.mor-chk{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:3;fill:none;stroke:var(--fi);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  clip-path:inset(0 100% 0 0);transition:clip-path .38s var(--e-out)}
.mor[data-s="done"] .mor-chk{clip-path:inset(0 0 0 0);transition-delay:.12s}
.mor-burst{position:absolute;left:50%;top:50%;width:var(--h0,76px);height:var(--h0,76px);margin:calc(var(--h0,76px) / -2) 0 0 calc(var(--h0,76px) / -2);pointer-events:none;opacity:0;
  --k:16px;clip-path:polygon(evenodd,var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k),var(--k) 0,calc(var(--k) + 1px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) calc(100% - var(--k) - 1px),calc(100% - var(--k) - 1px) calc(100% - 2px),2px calc(100% - 2px),2px calc(var(--k) + 1px),calc(var(--k) + 1px) 2px);
  background:var(--fc)}
.mor[data-s="done"] .mor-burst{animation:morBurst .7s var(--e-out) .1s 1 both}
@keyframes morBurst{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.mor .pm-lit{--lit:var(--fc)}
.mor:hover .pm-lit,.mor:focus-visible .pm-lit{opacity:.5}
.mor[data-s="busy"] .pm-lit,.mor[data-s="done"] .pm-lit{opacity:0!important}
.mor-ring{position:absolute;inset:-7px;pointer-events:none;opacity:0;--k:20px;clip-path:polygon(var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k));
  background:linear-gradient(var(--acc-text),var(--acc-text)) 0 0/100% 2px no-repeat,linear-gradient(var(--acc-text),var(--acc-text)) 0 100%/100% 2px no-repeat,linear-gradient(var(--acc-text),var(--acc-text)) 0 0/2px 100% no-repeat,linear-gradient(var(--acc-text),var(--acc-text)) 100% 0/2px 100% no-repeat}
.mor:focus-visible .mor-ring{opacity:1}
.mor[data-s="busy"] .mor-ring,.mor[data-s="done"] .mor-ring{opacity:0}
@media (max-width:520px),(max-height:480px){.mor{height:66px;min-width:280px;font-size:12px;letter-spacing:.24em}.mor.sec{height:58px;min-width:240px;font-size:11px}.mor-l>span{padding:0 32px}}
@media (prefers-reduced-motion:reduce){.mor-shape,.mor-chk,.mor-l>span{transition:none!important}.mor-spin i,.mor[data-s="done"] .mor-burst{animation:none}}
</style>
</head>
<body data-code="PEP-BTN-10" data-name="CHECK MORPH" data-hint="PRESS">
<!--@stage-->
<main class="pm-main">
  <section class="pm-duo" aria-label="Button states">
    <figure class="pm-cell is-primary">
      <figcaption class="pm-cap">PRIMARY</figcaption>
      <button class="mor pri" type="button" data-s="idle" aria-live="polite">
        <span class="pm-lit" aria-hidden="true"><i></i></span>
        <span class="mor-shape" aria-hidden="true"><span class="mor-glass"></span><span class="mor-fill"></span><span class="mor-rim"></span></span>
        <span class="mor-burst" aria-hidden="true"></span>
        <span class="mor-l"><span class="a"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2 10.5h10.6l1.9-7.5H6.3"/><circle cx="9" cy="19" r="1.3"/><circle cx="16.6" cy="19" r="1.3"/></svg>ADD TO CART</span><span class="b" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>ADDED</span></span>
        <span class="mor-spin" aria-hidden="true"><i></i></span>
        <svg class="mor-chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>
        <span class="mor-ring" aria-hidden="true"></span>
      </button>
    </figure>
    <figure class="pm-cell">
      <figcaption class="pm-cap">SECONDARY</figcaption>
      <button class="mor sec" type="button" data-s="idle" aria-live="polite">
        <span class="pm-lit" aria-hidden="true"><i></i></span>
        <span class="mor-shape" aria-hidden="true"><span class="mor-glass"></span><span class="mor-fill"></span><span class="mor-rim"></span></span>
        <span class="mor-burst" aria-hidden="true"></span>
        <span class="mor-l"><span class="a">SAVE FOR LATER</span><span class="b" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>SAVED</span></span>
        <span class="mor-spin" aria-hidden="true"><i></i></span>
        <svg class="mor-chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>
        <span class="mor-ring" aria-hidden="true"></span>
      </button>
    </figure>
  </section>
</main>
<!--@tail-->
<script>
(function(){
  var els=[].slice.call(document.querySelectorAll('.mor'));
  function size(el){var w=el.offsetWidth,h=el.offsetHeight;el.style.setProperty('--k',Math.max(0,(w-h)/2)+'px');el.style.setProperty('--h0',h+'px')}
  function run(el){
    if(el.dataset.s!=='idle')return;var rm=PM.RM,T=rm?[0,300,900,1900]:[0,1350,2350,3900];
    size(el);el.dataset.s='busy';
    setTimeout(function(){el.dataset.s='done'},T[1]);
    setTimeout(function(){el.dataset.s='open'},T[2]);
    setTimeout(function(){el.dataset.s='idle'},T[3]);
  }
  els.forEach(function(el){size(el);el.addEventListener('click',function(){run(el)})});
  addEventListener('resize',function(){els.forEach(size)});if(document.fonts)document.fonts.ready.then(function(){els.forEach(size)});
  /* idle demo while playing: the primary runs once every 9 s until someone touches the page */
  var acc=6,touched=false;document.addEventListener('pointerdown',function(){touched=true},{once:true});
  PM.ambient(function(dt){if(touched)return;acc+=dt;if(acc>9){acc=0;run(els[0])}});
})();
</script>
</body>
