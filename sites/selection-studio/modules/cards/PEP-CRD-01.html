/* =====================================================================
   SELECTION STUDIO · MODULE RUNTIME (shared by every live module, inlined by modules/_build.py)
   Brand tokens (PEPTICITY BLACK look), the accent layer (?acc=<slug> + postMessage {acc}),
   play/pause (postMessage {cmd}), the smoke stage, the corner hint and reduced motion.
   Ambient animation uses animation-play-state:var(--play) so the shell can pause it;
   interaction feedback (hover, press, focus) always answers.
   ===================================================================== */
@property --acc{syntax:'<color>';inherits:true;initial-value:#d4ff3a}
@property --acc-text{syntax:'<color>';inherits:true;initial-value:#d4ff3a}
:root{
  /* ground + metal (owner's BLACK image: wall #323232, metal #080807 to #8E8D85) */
  --ground:#0b0b0c; --uv:#120f1a; --wall:#323232;
  --ink:#eceef2; --ink2:#c3c7cf; --mute:#8c919b; --dim:#5d616a;
  --chrome:#e6e8ec; --plat:#b8bdc7; --steel:#7d828c; --gun-0:#080807; --gun-1:#55544f; --gun-2:#8e8d85;
  --hair:rgba(222,226,234,.14); --hair2:rgba(222,226,234,.26);
  --uvglow:rgba(146,118,255,.16); --edge:#dcd6ff;
  /* glass */
  --g-fill-a:rgba(255,255,255,.075); --g-fill-b:rgba(255,255,255,.012);
  --g-rim-hot:#ffffff; --g-rim-t:rgba(236,240,245,.70); --g-rim-s:rgba(200,207,216,.40); --g-rim-b:rgba(120,127,137,.42);
  --g-blur:blur(12px) saturate(165%);
  /* type */
  --fh:"PEPTICITY BLACK","Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --fc:"PEPTICITY BLACK CONDENSED","PEPTICITY BLACK",ui-sans-serif,system-ui,sans-serif;
  --fs:"PEPTICITY BLACK SPLIT","PEPTICITY BLACK",ui-sans-serif,system-ui,sans-serif;
  --fb:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  /* motion (motion-design-system tokens) */
  --d1:120ms; --d2:200ms; --d3:320ms; --d4:560ms; --d5:900ms; --d-sweep:1500ms;
  --e-out:cubic-bezier(.16,1,.3,1); --e-in:cubic-bezier(.7,0,.84,0); --e-io:cubic-bezier(.65,0,.35,1);
  --e-spring:linear(0,.056,.174,.313,.472,.624,.759,.863,.951,1.015,1.056,1.079,1.088,1.087,1.079,1.066,1.054,1.04,1.027,1.016,1.007,1.001,.997,.994,.992,.992,.993,.994,.995,.996,.997,.998,.999,1);
  --play:running; --m:1;
  /* accent (one colour, picked by the client; text tint stays 4.5:1 on black) */
  --acc:#D4FF3A; --acc-rgb:212,255,58; --acc-text:#D4FF3A;
  --acc-hi:color-mix(in srgb,var(--acc) 62%,#fff);
  --acc-dim:color-mix(in srgb,var(--acc) 58%,#16161a);
  --acc-soft:color-mix(in srgb,var(--acc) 16%,transparent);
  --acc-line:color-mix(in srgb,var(--acc) 72%,transparent);
  --acc-bloom:color-mix(in srgb,var(--acc) 46%,transparent);
  --acc-ink:#0b0b0c;
  transition:--acc .6s var(--e-io),--acc-text .6s var(--e-io);
  color-scheme:dark;
}
:root[data-acc="chartreuse"]{--acc:#D4FF3A;--acc-rgb:212,255,58;--acc-text:#D4FF3A;--acc-ink:#0b0b0c}
:root[data-acc="blue"]{--acc:#0066FF;--acc-rgb:0,102,255;--acc-text:color-mix(in srgb,#0066FF 60%,#fff);--acc-ink:#fff}
:root[data-acc="cyan"]{--acc:#0FFFFF;--acc-rgb:15,255,255;--acc-text:#0FFFFF;--acc-ink:#0b0b0c}
:root[data-acc="red"]{--acc:#FF004F;--acc-rgb:255,0,79;--acc-text:color-mix(in srgb,#FF004F 65%,#fff);--acc-ink:#fff}
:root[data-acc="violet"]{--acc:#6F00FF;--acc-rgb:111,0,255;--acc-text:color-mix(in srgb,#6F00FF 50%,#fff);--acc-ink:#fff}
:root[data-acc="orchid"]{--acc:#8D029B;--acc-rgb:141,2,155;--acc-text:color-mix(in srgb,#8D029B 50%,#fff);--acc-ink:#fff}
:root[data-acc="copper"]{--acc:#C46210;--acc-rgb:196,98,16;--acc-text:color-mix(in srgb,#C46210 65%,#fff);--acc-ink:#fff}
:root[data-acc="salmon"]{--acc:#FA8072;--acc-rgb:250,128,114;--acc-text:#FA8072;--acc-ink:#0b0b0c}
:root[data-acc="platinum"]{--acc:#E6E8EC;--acc-rgb:230,232,236;--acc-text:#E6E8EC;--acc-ink:#0b0b0c}
:root[data-acc="violet"],:root[data-acc="orchid"],:root[data-acc="blue"]{--acc-hi:color-mix(in srgb,var(--acc) 52%,#fff)}
:root[data-acc="red"]{--acc-hi:color-mix(in srgb,var(--acc) 76%,#fff)}
:root.is-paused{--play:paused}
:root.rm{--m:0}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground)}
body{color:var(--ink);font:400 15px/1.5 var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  min-height:100%;position:relative}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc-text);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img{display:block;max-width:100%}

/* ---------- the stage: matte + UV black, live silver smoke (BG-P01), a faint accent floor glow ---------- */
.pm-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(1200px 700px at 105% -10%,rgba(146,118,255,.10),transparent 60%),
    radial-gradient(900px 600px at -10% 110%,rgba(146,118,255,.06),transparent 60%),
    linear-gradient(118deg,var(--ground) 0%,var(--ground) 46%,#0d0b13 54%,#0d0b13 100%)}
.pm-bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pm-bg canvas.pc-nogl{display:none}
.pm-bg::before{content:"";position:absolute;left:50%;bottom:-38%;width:120%;height:70%;transform:translateX(-50%);
  background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 9%,transparent),transparent 72%);opacity:.9}
.pm-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(0,0,0,.6) 100%)}

    sweepB.material.uniforms.u.value = sw; sweepB.material.uniforms.k.value = REDUCED ? 0 : (b ? 0.5 : 0.6);
    /* the scan line (driven by the scan) */
    if (st.scanStart) {
      const q = (now - st.scanStart) / st.scanDur;
      if (q >= 1) { st.scanStart = 0; scanMat.uniforms.ks.value = 0; }
      else { scanMat.uniforms.s.value = -0.05 + q * 1.1; scanMat.uniforms.ks.value = Math.min(1, Math.sin(Math.min(1, q) * Math.PI) * 2.2) * 1.2; }
    }
    renderer.render(scene, camera);
    window.__card3d.frames++;
    const busy = Math.abs(st.flipT - st.flip) > 0.001 || Math.abs(st.flipV) > 0.001 || st.flare > 0 || st.scanStart || Math.abs(st.lay - st.layT) > 0.001 || st.drag;
    if ((!REDUCED && window.PM && PM.playing) || busy || st.pointerIn) raf = requestAnimationFrame(frame);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }
  window.__card3d = { frames: 0, st, renderer, kick };
  addEventListener('resize', kick); addEventListener('scroll', kick, { passive: true });
  D.classList.add('card3d-on');
  kick();
}
main().catch(e => { console.warn('[card3d] 3D card unavailable, the flat card stays', e); });
