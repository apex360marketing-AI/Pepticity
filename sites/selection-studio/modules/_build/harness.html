<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>module iframe harness</title>
<style>body{margin:0;background:#111;color:#ccc;font:12px system-ui}#w{width:860px;height:540px;margin:20px;border:1px solid #333;position:relative;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body><div id="w"><iframe id="f" title="module" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups" allow="autoplay; fullscreen"></iframe></div>
<script>
/* Test harness: embeds one module the way the studio shell does (?acc&hint=0&chrome=0&in=tile) and records its messages. */
var q = new URLSearchParams(location.search), f = document.getElementById('f');
window.__msgs = [];
addEventListener('message', function (e) { window.__msgs.push(e.data); });
f.src = '../' + q.get('m') + '?acc=' + (q.get('acc') || 'chartreuse') + '&hint=0&chrome=0&bare=1&in=' + (q.get('in') || 'tile');
window.send = function (m) { f.contentWindow.postMessage(m, '*'); };
</script></body></html>
