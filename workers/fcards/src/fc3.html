<div class="fc3" data-fc="3">
  <div class="fc3-seat" data-fc-seat>
    <span class="fc3-floor" aria-hidden="true"></span>
    <span class="fc3-under" data-fc-under aria-hidden="true"></span>
    {{FORM_OPEN}}
      <div class="fc3-pane fc3-pane-a">
        <span class="fc3-glass fc3-glass-a" data-fc-glass data-fc-rim aria-hidden="true"><span class="fc3-mark" data-fc-mark></span><span class="fc3-wet"></span><span class="fc3-spec"></span></span>
        <div class="fc3-in fc3-in-a">
          {{KICKER}}
          <h2 class="fc3-ask" id="fc3-title"><span class="fc3-line" data-text="JOIN THE"><span class="fc3-face">JOIN THE</span></span> <span class="fc3-line" data-text="FOUNDER"><span class="fc3-face">FOUNDER</span></span> <span class="fc3-line" data-text="CIRCLE"><span class="fc3-face">CIRCLE</span></span></h2>
          {{OFFER}}
        </div>
        {{LIGHT}}
      </div>
      <div class="fc3-pane fc3-pane-b">
        <span class="fc3-glass fc3-glass-b" data-fc-glass data-fc-rim aria-hidden="true"><span class="fc3-wet"></span><span class="fc3-spec"></span></span>
        <div class="fc3-in fc3-in-b">
          {{LABEL}}
          {{WELL}}
          {{ERR}}
          {{KEY}}
          {{DONE}}
          {{CONSENT}}
          {{FINE}}
        </div>
      </div>
    </form>
  </div>
</div>
