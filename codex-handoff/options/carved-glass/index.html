.row{display:grid;justify-items:center;width:100%}
.slab{--h:88px;--r:13px;position:relative;isolation:isolate;display:inline-grid;place-items:center;height:var(--h);padding:0 calc(var(--h)*.66);border:0;border-radius:var(--r);color:inherit;cursor:pointer;font-size:calc(var(--h)*.235);line-height:1;letter-spacing:.22em;-webkit-tap-highlight-color:transparent;

-webkit-backdrop-filter:blur(2px) saturate(170%) brightness(1.16);backdrop-filter:blur(2px) saturate(170%) brightness(1.16);
box-shadow:inset 0 1px 0 rgba(255,255,255,.62),inset 0 -1px 0 rgba(255,255,255,.36),inset 1px 0 0 rgba(255,255,255,.10),inset -1px 0 0 rgba(255,255,255,.10),inset 0 12px 16px -14px rgba(255,255,255,.55),inset 0 -16px 18px -16px rgba(206,226,255,.50),0 22px 30px -22px rgba(0,0,0,.95);
transition:transform .55s cubic-bezier(.2,1.35,.3,1),box-shadow .5s,filter .5s}
.slab.xl{--h:clamp(92px,13.5vw,168px);font-size:calc(var(--h)*.215)}.slab.sm{--h:58px;font-size:calc(var(--h)*.25)}
.slab::after{content:"";position:absolute;left:14%;right:14%;bottom:-1px;height:2px;background:radial-gradient(closest-side,#fff,rgba(226,238,255,.85) 38%,transparent);pointer-events:none}
.slab::before{content:"";position:absolute;left:20%;right:20%;top:100%;height:18px;background:radial-gradient(60% 100% at 50% 0,rgba(214,230,255,.30),transparent 72%);pointer-events:none}
.o-s2 .slab{--r:22px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(225,238,255,.03) 36%,rgba(225,238,255,.015) 62%,rgba(214,230,255,.08))}
.o-s3 .slab{--r:8px;-webkit-backdrop-filter:blur(7px) saturate(180%) brightness(1.22);backdrop-filter:blur(7px) saturate(180%) brightness(1.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.46),inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.12),inset 0 22px 24px -20px rgba(255,255,255,.6),inset 0 -30px 30px -24px rgba(206,226,255,.62),0 26px 34px -24px rgba(0,0,0,.95)}
@supports (backdrop-filter:url(#x)){
.o-s1 .slab{backdrop-filter:url(#lg1) saturate(170%) brightness(1.16)}
.o-s2 .slab{backdrop-filter:url(#lg2) saturate(175%) brightness(1.18)}
.o-s3 .slab{backdrop-filter:url(#lg3) blur(5px) saturate(180%) brightness(1.22)}}
.sheen{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:-1}
.sheen::before{content:"";position:absolute;top:-25%;bottom:-25%;left:0;width:42%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07) 42%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.07) 58%,transparent);transform:translateX(-170%) skewX(-18deg);animation:sh 8s cubic-bezier(.4,0,.2,1) infinite}
.o-s2 .sheen::before{animation-duration:5.5s;width:60%}
@keyframes sh{0%,45%{transform:translateX(-170%) skewX(-18deg)}100%{transform:translateX(420%) skewX(-18deg)}}
.slab:hover{transform:translateY(-4px) scale(1.045);filter:brightness(1.1)}
.slab:active{transform:translateY(0) scale(.985)}
.slab:focus-visible{outline:1px solid rgba(255,255,255,.95);outline-offset:5px}
.w{position:relative;display:inline-block;margin-right:-.22em}
.cut{position:relative;display:inline-block;white-space:nowrap;color:transparent;-webkit-text-fill-color:transparent;background-image:linear-gradient(180deg,rgba(214,228,246,.26),rgba(214,228,246,.44));-webkit-background-clip:text;background-clip:text;text-shadow:0 -1px 0 rgba(0,0,0,.62),0 1px 0 rgba(255,255,255,.40);clip-path:inset(-40% calc((1 - var(--p,0))*100%) -40% -3%)}
.cut::after{content:attr(data-t);position:absolute;inset:0;color:transparent;-webkit-text-fill-color:transparent;background-image:linear-gradient(180deg,#ffffff,#f3f7ff 55%,#dce7f6);-webkit-background-clip:text;background-clip:text;text-shadow:0 0 1px #fff,0 0 5px rgba(246,250,255,.92),0 0 13px rgba(196,218,255,.34);opacity:0;transition:opacity .9s ease .1s}
.lit .cut::after{opacity:1}
.o-s2 .cut{background-image:linear-gradient(180deg,rgba(226,236,250,.40),rgba(226,236,250,.54));text-shadow:0 -1px 1px rgba(0,0,0,.42),0 1px 1px rgba(255,255,255,.34)}
.o-s2 .cut::after{text-shadow:0 0 1px #fff,0 0 7px rgba(246,250,255,.86),0 0 18px rgba(206,224,255,.30)}
.o-s3 .cut{background-image:linear-gradient(180deg,rgba(150,170,196,.18),rgba(226,236,250,.50));text-shadow:0 -2px 0 rgba(0,0,0,.78),0 -1px 0 rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.55),0 2px 1px rgba(255,255,255,.16)}
.o-s3 .cut::after{text-shadow:0 0 1px #fff,0 0 4px #fff,0 0 10px rgba(226,238,255,.5),0 1px 0 rgba(255,255,255,.7)}
.spark{position:absolute;top:50%;left:calc(var(--p,0)*100%);width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;opacity:0;background:radial-gradient(closest-side,#fff 0 7%,rgba(232,242,255,.95) 12%,rgba(170,205,255,.35) 30%,transparent 62%)}
.spark::before{content:"";position:absolute;left:50%;bottom:50%;width:1px;height:calc(var(--h)*.9);margin-left:-.5px;background:linear-gradient(to top,rgba(255,255,255,.95),rgba(255,255,255,0))}
.carving .spark{opacity:1;animation:fl .09s steps(2) infinite}
@keyframes fl{50%{transform:scale(.82)}}
.again{margin-top:6px;padding:14px 18px;min-height:44px;border:0;background:none;color:#8fa1b6;font-size:11px;letter-spacing:.34em;cursor:pointer}
.again:hover{color:#fff;text-shadow:0 0 8px rgba(207,230,255,.6)}.again:focus-visible{color:#fff;outline:1px solid rgba(255,255,255,.9);outline-offset:2px}
.end{padding:10vh 16px 16vh;text-align:center;font-size:13px;letter-spacing:.3em;color:#aebccc}
svg.defs{position:absolute;width:0;height:0}
@media (max-width:520px){.slab{--h:70px}.slab.sm{--h:52px}}
@media (prefers-reduced-motion:reduce){.slab,.cut::after{transition:none}.slab:hover{transform:none}.spark{display:none}.sheen::before{animation:none}}

<script>
(function(){
  var els=[].slice.call(document.querySelectorAll('[data-carve]')),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,tick=false;
  function set(e,p){e.__p=p;e.style.setProperty('--p',p.toFixed(3));e.classList.toggle('carving',p>0.001&&p<0.999);e.classList.toggle('lit',p>=0.999);}
  function upd(){tick=false;var vh=innerHeight;els.forEach(function(e){if(e.__busy)return;var r=e.getBoundingClientRect();var p=Math.max(0,Math.min(1,(vh*0.92-r.top)/(vh*0.40)));if(reduce)p=1;if(p>(e.__p||0))set(e,p);});}
  function play(e,delay){e.__busy=true;set(e,0);var t0=null,dur=1500;setTimeout(function(){requestAnimationFrame(function f(t){if(t0===null)t0=t;var p=Math.min(1,(t-t0)/dur);set(e,p);if(p<1)requestAnimationFrame(f);else e.__busy=false;});},delay);}
  els.forEach(function(e){set(e,0);});
