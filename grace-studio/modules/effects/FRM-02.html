  const notchMat = [new THREE.MeshBasicMaterial({ color: 0x6b7077, transparent: true, opacity: 0.55 }), new THREE.MeshBasicMaterial({ color: 0xf4f6ff, toneMapped: false })];

  { const big = words('MEMBER', 0.15, 0.08), sub = words('THE PEPTICITY TEAM', 0.042, 0.12); big.position.set(-big.userData.w / 2, -0.06, 0); sub.position.set(-sub.userData.w / 2, -0.21, 0);

  /* ---------- accent: the chip glow, its rim and the P's hairline take a share of your colour ---------- */

  let rw = 0, rh = 0, lastF = 0;

    rig.rotation.set(fl2 * 0.035 * m, Math.sin(t * 0.5) * 0.05 * m, 0);

    return Math.abs(st.flipT - st.flip) > 0.001 || Math.abs(st.flipV) > 0.001 || st.flare > 0 || !!st.drag || Math.abs(st.tx) > 1e-3 || Math.abs(st.mx) > 0.05;
  });
  window.__fx3d = { st, renderer };
}
