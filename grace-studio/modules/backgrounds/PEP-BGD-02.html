<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEP-BGD-02 · HELIX FIELD · PEPTICITY</title>
<meta name="fx-code" content="PEP-BGD-02"><meta name="fx-interact" content="hover">
<link rel="icon" href="data:,">
<link rel="preload" href="../_assets/fonts/PepticityBlack.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../_shared/button.css">
<link rel="stylesheet" href="../_shared/fx-kit.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
/* PEP-BGD-02 HELIX FIELD: the peptide swirl from the bottle, as a slow field of bead helices floating at different depths in
   the dark. Each one turns on its own axis and drifts upward; a few beads catch your colour and travel along the strands.
   Move the pointer and the whole field shifts in depth. */
body{background:radial-gradient(90% 80% at 50% 45%,#121117 0%,#09090b 60%,#040405 100%)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0}
</style>
</head>
<body>
<div class="fx-tag"><i></i><b>PEP-BGD-02</b><span>HELIX FIELD</span></div>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="fx-vig" aria-hidden="true"></div>
<section class="bg-sample">
  <p class="fx-eyebrow">THE PEPTIDE SWIRL · A SLOW FIELD</p>
  <h2 class="fx-h fx-chrome">PEPTICITY</h2>
  <div class="fx-glass bg-card"><b>THE GROUND BEHIND EVERY PAGE</b><span>Move your pointer and the field shifts in depth.</span>
    <button class="pc-btn pc-btn--sm" type="button"><span class="pc-btn__face"><span class="pc-btn__label">JOIN THE TEAM</span></span></button></div>
</section>
<script src="../_shared/fx-kit.js"></script>
<script type="module">
import * as THREE from 'three';
FX.hint('hover', FX.coarse ? 'TAP' : 'HOVER');
const canvas = document.getElementById('gl');
let R;
try { R = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch (e) { R = null; }
if (R) {
  R.setPixelRatio(Math.min(devicePixelRatio || 1, FX.mobile ? 1.5 : 2)); R.setClearColor(0, 0);
  const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x070709, 0.085);
  const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 80); cam.position.set(0, 0, 12);
  const bead = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(28, 26, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(236,240,250,.9)'); g.addColorStop(0.55, 'rgba(160,168,186,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  const vtx = `attribute float size;attribute vec3 tint;varying vec3 vT;varying float vF;uniform float px;
    void main(){vT=tint;vec4 mv=modelViewMatrix*vec4(position,1.);vF=clamp(exp(-0.0021*mv.z*mv.z),0.,1.);gl_PointSize=size*px*(200./-mv.z);gl_Position=projectionMatrix*mv;}`;
  const frg = `uniform sampler2D map;varying vec3 vT;varying float vF;void main(){vec4 c=texture2D(map,gl_PointCoord);float a=c.a*vF;if(a<.01)discard;gl_FragColor=vec4(c.rgb*vT,a);}`;
  const mat = new THREE.ShaderMaterial({ uniforms: { map: { value: bead }, px: { value: R.getPixelRatio() } }, vertexShader: vtx, fragmentShader: frg, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  /* helices: two strands of beads plus faint rungs, like the swirl beside PEPTICITY on the bottle */
  const H = [], N = FX.mobile ? 3 : 6;
  let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let h = 0; h < N; h++) {
    const len = 6 + rnd() * 5, turns = 2.2 + rnd() * 1.6, rad = 0.45 + rnd() * 0.3, per = Math.round(len * 9);
    const pos = [], size = [], tint = [], rungs = [];
    for (let s = 0; s < 2; s++) for (let i = 0; i < per; i++) {
      const t = i / (per - 1), a = t * turns * Math.PI * 2 + s * Math.PI;
      pos.push(Math.cos(a) * rad, (t - 0.5) * len, Math.sin(a) * rad); size.push(0.9 + 0.6 * ((i * 7) % 5) / 5); tint.push(0.6, 0.62, 0.68);
      if (s === 0 && i % 3 === 0) rungs.push(Math.cos(a) * rad, (t - 0.5) * len, Math.sin(a) * rad, Math.cos(a + Math.PI) * rad, (t - 0.5) * len, Math.sin(a + Math.PI) * rad);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('size', new THREE.Float32BufferAttribute(size, 1));
    const tAttr = new THREE.Float32BufferAttribute(tint, 3); g.setAttribute('tint', tAttr);
    const grp = new THREE.Group(); grp.add(new THREE.Points(g, mat));
    const rg = new THREE.BufferGeometry(); rg.setAttribute('position', new THREE.Float32BufferAttribute(rungs, 3));
    grp.add(new THREE.LineSegments(rg, new THREE.LineBasicMaterial({ color: 0x9aa2b2, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false })));
    const z = -2 - rnd() * 12, x = (rnd() - 0.5) * 22 * (FX.mobile ? 0.5 : 1), y = (rnd() - 0.5) * 8;
    grp.position.set(x, y, z); grp.rotation.z = (rnd() - 0.5) * 1.1; grp.rotation.x = (rnd() - 0.5) * 0.5;
    scene.add(grp);
    H.push({ grp, tAttr, per, spin: (0.08 + rnd() * 0.12) * (rnd() < 0.5 ? -1 : 1), rise: 0.05 + rnd() * 0.08, y0: y, ph: rnd() * 10, glint: [rnd(), rnd()], gs: 0.05 + rnd() * 0.05 });
  }
  /* dust */
  const DN = FX.mobile ? 160 : 380, dp = [], ds = [], dt0 = [];
  for (let i = 0; i < DN; i++) { dp.push((rnd() - 0.5) * 30, (rnd() - 0.5) * 18, -rnd() * 20); ds.push(0.25 + rnd() * 0.35); dt0.push(0.55, 0.58, 0.66); }
  const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3)); dg.setAttribute('size', new THREE.Float32BufferAttribute(ds, 1)); dg.setAttribute('tint', new THREE.Float32BufferAttribute(dt0, 3));
  const dust = new THREE.Points(dg, mat); scene.add(dust);
  let acc = new THREE.Color(); FX.onAcc(a => { acc.setRGB(a.rgb[0] / 255, a.rgb[1] / 255, a.rgb[2] / 255); FX.wake(); });
  let w = 0, h = 0, cx = 0, cy = 0;
  FX.loop((dt, t, now, live) => {
    const W = canvas.clientWidth, Hh = canvas.clientHeight; if (W !== w || Hh !== h) { w = W; h = Hh; R.setSize(W, Hh, false); cam.aspect = W / Hh; cam.updateProjectionMatrix(); }
    const P = FX.pointer;
    cx = FX.damp(cx, P.inside && !FX.rm ? P.nx * 1.6 : 0, 2, dt); cy = FX.damp(cy, P.inside && !FX.rm ? -P.ny * 0.9 : 0, 2, dt);
    cam.position.set(cx, cy, 12); cam.lookAt(0, 0, -4);
    H.forEach(o => {
      o.grp.rotation.y = o.ph + t * o.spin;
      o.grp.position.y = ((o.y0 + t * o.rise + 9) % 18) - 9;
      /* two beads per helix carry the accent along the strand */
      const arr = o.tAttr.array, n = o.per * 2;
      for (let i = 0; i < n; i++) { arr[i * 3] = 0.6; arr[i * 3 + 1] = 0.62; arr[i * 3 + 2] = 0.68; }
      o.glint.forEach((g0, k) => { const u = (g0 + t * o.gs) % 1, i = Math.floor(u * (o.per - 1)) + k * o.per;
        for (let d = -2; d <= 2; d++) { const j = i + d; if (j < k * o.per || j >= (k + 1) * o.per) continue; const f = 1 - Math.abs(d) / 3;
          arr[j * 3] = 0.6 + (acc.r * 1.5 - 0.6) * f; arr[j * 3 + 1] = 0.62 + (acc.g * 1.5 - 0.62) * f; arr[j * 3 + 2] = 0.68 + (acc.b * 1.5 - 0.68) * f; } });
      o.tAttr.needsUpdate = true;
    });
    dust.rotation.y = t * 0.01; dust.position.y = Math.sin(t * 0.1) * 0.3;
    R.render(scene, cam);
    return Math.abs(cx - (P.inside && !FX.rm ? P.nx * 1.6 : 0)) > 1e-3;
  });
}
</script>
</body>
</html>
