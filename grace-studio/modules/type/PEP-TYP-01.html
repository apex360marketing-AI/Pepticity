<style>
/* =====================================================================
   SELECTION STUDIO · MODULE RUNTIME (shared by every live module, inlined by modules/_build.py)
   Brand tokens (PEPTICITY BLACK look), the accent layer (?acc=<slug> + postMessage {acc}),
   play/pause (postMessage {cmd}), the smoke stage, the corner hint and reduced motion.
   Ambient animation uses animation-play-state:var(--play) so the shell can pause it;
   interaction feedback (hover, press, focus) always answers.
   ===================================================================== */
@property --acc{syntax:'<color>';inherits:true;initial-value:#d4ff3a}
@property --acc-text{syntax:'<color>';inherits:true;initial-value:#d4ff3a}
:root{
  /* ground + metal (owner's BLACK image: wall #323232, metal #080807 to #8E8D85) */
  --ground:#0b0b0c; --uv:#120f1a; --wall:#323232;
  --ink:#eceef2; --ink2:#c3c7cf; --mute:#8c919b; --dim:#5d616a;
  --chrome:#e6e8ec; --plat:#b8bdc7; --steel:#7d828c; --gun-0:#080807; --gun-1:#55544f; --gun-2:#8e8d85;
  --hair:rgba(222,226,234,.14); --hair2:rgba(222,226,234,.26);
  --uvglow:rgba(146,118,255,.16); --edge:#dcd6ff;
  /* glass */
  --g-fill-a:rgba(255,255,255,.075); --g-fill-b:rgba(255,255,255,.012);
  --g-rim-hot:#ffffff; --g-rim-t:rgba(236,240,245,.70); --g-rim-s:rgba(200,207,216,.40); --g-rim-b:rgba(120,127,137,.42);
  --g-blur:blur(12px) saturate(165%);
  /* type */
  --fh:"PEPTICITY BLACK","Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --fc:"PEPTICITY BLACK CONDENSED","PEPTICITY BLACK",ui-sans-serif,system-ui,sans-serif;
  --fs:"PEPTICITY BLACK SPLIT","PEPTICITY BLACK",ui-sans-serif,system-ui,sans-serif;
  --fb:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  /* motion (motion-design-system tokens) */
  --d1:120ms; --d2:200ms; --d3:320ms; --d4:560ms; --d5:900ms; --d-sweep:1500ms;
  --e-out:cubic-bezier(.16,1,.3,1); --e-in:cubic-bezier(.7,0,.84,0); --e-io:cubic-bezier(.65,0,.35,1);
  --e-spring:linear(0,.056,.174,.313,.472,.624,.759,.863,.951,1.015,1.056,1.079,1.088,1.087,1.079,1.066,1.054,1.04,1.027,1.016,1.007,1.001,.997,.994,.992,.992,.993,.994,.995,.996,.997,.998,.999,1);
  --play:running; --m:1;
  /* accent (one colour, picked by the client; text tint stays 4.5:1 on black) */
  --acc:#D4FF3A; --acc-rgb:212,255,58; --acc-text:#D4FF3A;
  --acc-hi:color-mix(in srgb,var(--acc) 62%,#fff);
  --acc-dim:color-mix(in srgb,var(--acc) 58%,#16161a);
  --acc-soft:color-mix(in srgb,var(--acc) 16%,transparent);
  --acc-line:color-mix(in srgb,var(--acc) 72%,transparent);
  --acc-bloom:color-mix(in srgb,var(--acc) 46%,transparent);
  --acc-ink:#0b0b0c;
  transition:--acc .6s var(--e-io),--acc-text .6s var(--e-io);
  color-scheme:dark;
}
:root[data-acc="chartreuse"]{--acc:#D4FF3A;--acc-rgb:212,255,58;--acc-text:#D4FF3A;--acc-ink:#0b0b0c}
:root[data-acc="blue"]{--acc:#0066FF;--acc-rgb:0,102,255;--acc-text:color-mix(in srgb,#0066FF 60%,#fff);--acc-ink:#fff}
:root[data-acc="cyan"]{--acc:#0FFFFF;--acc-rgb:15,255,255;--acc-text:#0FFFFF;--acc-ink:#0b0b0c}
:root[data-acc="red"]{--acc:#FF004F;--acc-rgb:255,0,79;--acc-text:color-mix(in srgb,#FF004F 65%,#fff);--acc-ink:#fff}
:root[data-acc="violet"]{--acc:#6F00FF;--acc-rgb:111,0,255;--acc-text:color-mix(in srgb,#6F00FF 50%,#fff);--acc-ink:#fff}
:root[data-acc="orchid"]{--acc:#8D029B;--acc-rgb:141,2,155;--acc-text:color-mix(in srgb,#8D029B 50%,#fff);--acc-ink:#fff}
:root[data-acc="copper"]{--acc:#C46210;--acc-rgb:196,98,16;--acc-text:color-mix(in srgb,#C46210 65%,#fff);--acc-ink:#fff}
:root[data-acc="salmon"]{--acc:#FA8072;--acc-rgb:250,128,114;--acc-text:#FA8072;--acc-ink:#0b0b0c}
:root[data-acc="platinum"]{--acc:#E6E8EC;--acc-rgb:230,232,236;--acc-text:#E6E8EC;--acc-ink:#0b0b0c}
:root[data-acc="violet"],:root[data-acc="orchid"],:root[data-acc="blue"]{--acc-hi:color-mix(in srgb,var(--acc) 52%,#fff)}
:root[data-acc="red"]{--acc-hi:color-mix(in srgb,var(--acc) 76%,#fff)}
:root.is-paused{--play:paused}
:root.rm{--m:0}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground)}
body{color:var(--ink);font:400 15px/1.5 var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  min-height:100%;position:relative}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc-text);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img{display:block;max-width:100%}

/* ---------- the stage: matte + UV black, live silver smoke (BG-P01), a faint accent floor glow ---------- */
.pm-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(1200px 700px at 105% -10%,rgba(146,118,255,.10),transparent 60%),
    radial-gradient(900px 600px at -10% 110%,rgba(146,118,255,.06),transparent 60%),
    linear-gradient(118deg,var(--ground) 0%,var(--ground) 46%,#0d0b13 54%,#0d0b13 100%)}
.pm-bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pm-bg canvas.pc-nogl{display:none}

<script type="module">

const GLYPHS = JSON.parse(document.getElementById('glyph-data').textContent);

// ------------------------------------------------------------------ textures
function brushedTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d'); x.fillStyle = '#c4c4c4'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2600; i++) {
    const y = Math.random() * 512, v = 150 + Math.random() * 105, a = 0.05 + Math.random() * 0.22;

}
function wallTexture(light) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(640, 170, 40, 560, 260, 720);
  if (light) { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e9ebee'); }

// ------------------------------------------------------------------ stage

  [[-6, 4, 0, .35, 9], [6.5, 2.5, 1, .3, 8], [0, 9.5, 3, 7, .3], [3, -2, 6, 5, .25]].forEach(([x, y, z, w, h]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w > 1 ? .3 : w), strip); m.position.set(x, y, z); room.add(m);
  });
  const envRT = pmrem.fromScene(room, 0.03);

  const brushed = brushedTexture();
  const MAT = {
    gunmetal: new THREE.MeshPhysicalMaterial({ color: 0x7a7b80, metalness: 0.86, roughness: 0.52, roughnessMap: brushed, map: brushed,
      clearcoat: 0.08, clearcoatRoughness: 0.6, envMapIntensity: 0.62 }),
    platinum: new THREE.MeshPhysicalMaterial({ color: 0xe4e6ea, metalness: 1, roughness: 0.17, roughnessMap: brushed, envMapIntensity: 1.1 }),
    goldchrome: new THREE.MeshPhysicalMaterial({ color: 0xdcceaa, metalness: 1, roughness: 0.2, roughnessMap: brushed, envMapIntensity: 1.05 }),
    chevron: new THREE.MeshPhysicalMaterial({ color: 0x55544f, metalness: 0.6, roughness: 0.48, roughnessMap: brushed, map: brushed, envMapIntensity: 0.5 }),
    uv: new THREE.MeshPhysicalMaterial({ color: 0x0e0c14, metalness: 0.55, roughness: 0.32, sheen: 1, sheenColor: new THREE.Color(0x4b3b86),
      sheenRoughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.25, envMapIntensity: 0.7 }),

// ------------------------------------------------------------------ glyph geometry
const geoCache = new Map();
function regroupBevel(g) {
  // ExtrudeGeometry: group 0 = caps, group 1 = sides + bevel. Move bevel triangles to the face material.
  const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
  const capT = [], sideT = [];

  const tris = (grp, fn) => { for (let i = grp.start; i < grp.start + grp.count; i += 3) fn(i); };

  tris(cap, i => { capT.push(i); a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);

  tris(side, i => {
    a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);
    n.subVectors(c, b).cross(a.clone().sub(b)).normalize();

  const build = (attr, size) => { const arr = new Float32Array((capT.length + sideT.length) * 3 * size); let o = 0;
    for (const i of [...capT, ...sideT]) for (let v = 0; v < 3; v++) for (let k = 0; k < size; k++) arr[o++] = attr.array[(i + v) * size + k];
    return new THREE.BufferAttribute(arr, size); };
  out.setAttribute('position', build(pos, 3)); out.setAttribute('normal', build(nor, 3)); if (uv) out.setAttribute('uv', build(uv, 2));
  out.addGroup(0, capT.length * 3, 0); out.addGroup(capT.length * 3, sideT.length * 3, 1);
  return out;
}

function glyphGeometries(cut, ch, opt) {
  const key = [cut, ch, opt.depth, opt.bevel].join('|');
  if (geoCache.has(key)) return geoCache.get(key);
  const G = GLYPHS[cut][ch]; if (!G) return null;
  const S = 1 / 1000;
  const parts = G.p.map(p => {
    const shape = new THREE.Shape(p.o.map(([x, y]) => new THREE.Vector2(x * S, y * S)));
    p.h.forEach(h => shape.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x * S, y * S)))));
    let g = new THREE.ExtrudeGeometry(shape, { depth: opt.depth, bevelEnabled: true, bevelThickness: opt.bevel, bevelSize: opt.bevel * 0.9,
      bevelOffset: -opt.bevel * 0.9, bevelSegments: MOBILE ? 1 : 2, curveSegments: 2, steps: 1 });
    g = toCreasedNormals(g, 0.6);

    const pts = [];
    const ring = arr => { for (let i = 0; i < arr.length; i++) { const [x0, y0] = arr[i], [x1, y1] = arr[(i + 1) % arr.length];
      pts.push(x0 * S, y0 * S, opt.depth + 0.0005, x1 * S, y1 * S, opt.depth + 0.0005); } };
    ring(p.o); p.h.forEach(ring);

    return { g, lg, area: Math.abs(area) };

// a word as a group of letter pivots (each letter can spin about its own centre)
function makeWord(stage, text, { cut = 'regular', face = 'gunmetal', depth = 0.1, bevel = 0.012, edge = true, darkA = true, track = 0, shadows = true } = {}) {

    const pivot = new THREE.Group();
    const inner = new THREE.Group(); pivot.add(inner);
    const maxArea = Math.max(...geo.parts.map(p => p.area));
    geo.parts.forEach(p => {
      const faceMat = (darkA && ch === 'A' && p.area === maxArea && geo.parts.length > 1) ? stage.MAT.chevron : stage.MAT[face];

// a matte wall with soft cast shadow, the way the reference is lit

  const scene = new THREE.Scene();

  const rim = new THREE.PointLight(0x7a5cff, light ? 0.0 : 0.45, 6, 2); rim.position.set(-2.2, -0.8, 1.2); scene.add(rim);
  const camera = new THREE.PerspectiveCamera(26, 2, 0.1, 60);

// fit a camera so a w x h box fills `fill` of the slot
function fitCamera(camera, w, h, aspect, fill = 0.9, lookY = 0) {
  const vfov = camera.fov * Math.PI / 180;

  const d = Math.max(distH, distW);
  camera.position.set(0, lookY, d); camera.lookAt(0, lookY, 0);
  return d;

// ---------------------------------------------------------------- the brand-font page set-up (section 02), driven by the studio
const stage = createStage(document.getElementById('gl'));
if (stage) {
  /* drive: 0.5 = letters in place (what the brand page shows mid-scroll); the intro and a drag move it */
  const D = { v: REDUCED ? 0.5 : 0.1, t: 0.5, held: false };
  const slotEl = n => document.querySelector(`[data-slot="${n}"]`);
  function wordSlot(name, text, o = {}) {
    const ws = wallScene(stage, o.wall || {});
    const w = makeWord(stage, text, o.word || {});
    ws.scene.add(w.group);
    const st = { ry: 0, rx: 0, l: w.letters.map(() => ({ ry: o.funky ? 1.2 : 0, z: 0 })) };

      scene: ws.scene, camera: ws.camera,
      fit: a => fitCamera(ws.camera, w.width, w.height, a, o.fill || 0.86, o.lookY || 0),

            L.rotation.y = s.ry; L.position.z = s.z;

        }
      }
    });
  }
  wordSlot('pepticity', 'PEPTICITY', { fill: 0.84, funky: 1 });
  wordSlot('studio', 'STUDIO', { fill: 0.6, funky: 0.8 });
  /* the studio's play/pause + drag driver (sets __t3dBusy so the paused engine still answers the hand) */
  let busyT = 0;
  const loop = PM.loop((now, dt) => {
    if (!D.held) D.t = PM.damp(D.t, 0.5, 2.2, dt);
    D.v = REDUCED ? 0.5 : PM.damp(D.v, D.t, D.held ? 9 : 2.4, dt);
    window.__t3dBusy = now < busyT || Math.abs(D.v - 0.5) > 0.002;
    stage.kick();
    return window.__t3dBusy;
  });
  const wake = ms => { busyT = performance.now() + (ms || 1400); loop.kick(); };
  PM.on('play', () => { D.v = REDUCED ? 0.5 : 0.1; D.t = 0.5; wake(2600); stage.kick(); });
  addEventListener('pointermove', () => wake(900), { passive: true });
  const sheet = document.getElementById('sheet');
  let x0 = 0;
  sheet.addEventListener('pointerdown', e => { D.held = true; x0 = e.clientX; try { sheet.setPointerCapture(e.pointerId); } catch (_) {} wake(); });
  sheet.addEventListener('pointermove', e => { if (!D.held) return; D.t = clamp(0.5 - (e.clientX - x0) / Math.max(300, sheet.clientWidth) * 0.9, 0, 1); wake(); });
  const up = () => { if (D.held) { D.held = false; wake(2400); } };
  sheet.addEventListener('pointerup', up); sheet.addEventListener('pointercancel', up);
  sheet.addEventListener('wheel', e => { if (REDUCED) return; e.preventDefault(); D.t = clamp(D.t + e.deltaY * 0.0012, 0, 1); wake(2400); }, { passive: false });
  if (PM.playing) wake(2600);
  /* while playing, the letters turn through once every 9 s so a still tile shows the 3D */
  let acc = 0; PM.ambient(dt => { acc += dt; if (acc > 9 && !D.held) { acc = 0; D.v = 0.2; wake(2600); } });
}
</script>
