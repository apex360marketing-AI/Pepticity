<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEP-EMB-02 · THE 3D P · PEPTICITY</title>
<meta name="fx-code" content="PEP-EMB-02"><meta name="fx-interact" content="scroll">
<link rel="icon" href="data:,">
<link rel="preload" href="../_assets/fonts/PepticityBlack.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../_shared/fx-kit.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
/* PEP-EMB-02 THE 3D P: the approved PEPTICITY P (matte gunmetal face, UV-black sides with a violet sheen, a hairline of light
   on every edge) standing off the matte wall with its soft shadow. It leans toward your pointer and turns as you scroll:
   a full turn, a lean back, and home to face you. */
body{background:#232224}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.wallfb{position:fixed;inset:0;background:radial-gradient(70% 60% at 62% 32%,#5a595b,#3b3a3c 55%,#232224);z-index:0}
.cap{position:fixed;z-index:3;left:50%;bottom:clamp(30px,7vh,64px);transform:translateX(-50%);display:grid;justify-items:center;gap:8px;text-align:center;width:min(520px,92vw);pointer-events:none}
.cap .fx-p{font-size:13.5px;color:#d2d5db;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.cap .fx-eyebrow{color:#c9cdd4}
.stage-txt{position:fixed;z-index:3;top:clamp(60px,11vh,110px);left:50%;transform:translateX(-50%);font:400 9px var(--fh);letter-spacing:.34em;color:#b9bdc4;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.flat{position:fixed;inset:0;display:grid;place-items:center;z-index:1}
.flat img{width:min(40vmin,360px);filter:brightness(.5)}
</style>
</head>
<body>
<div class="fx-tag"><i></i><b>PEP-EMB-02</b><span>THE 3D P</span></div>
<div class="wallfb" aria-hidden="true"></div>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="flat" id="flat" hidden><img src="../_assets/logo/p-mark.svg" alt="The PEPTICITY P"></div>
<main class="fx-scroller" id="sc" tabindex="0" aria-label="The PEPTICITY P in 3D: scroll to turn it">
  <section class="fx-pin" style="--len:420vh"><div class="fx-sticky"><h2 class="sr">The PEPTICITY P</h2></div></section>
</main>
<div class="stage-txt" id="stx">SCROLL TO TURN IT</div>
<div class="cap"><p class="fx-eyebrow" style="justify-content:center">THE P, IN 3D</p><p class="fx-p">It leans toward your pointer. Scroll and it turns all the way round.</p></div>
<script src="../_shared/fx-kit.js"></script>
<script type="module">
import { THREE, stage3d, wallScene, fitCamera, pMesh, accentEdges } from '../_shared/fx3d.mjs';
const sc = FX.scroller(document.getElementById('sc'), { ease: 3.4, tourPeriod: 16 }); FX.rail(sc); FX.hint('scroll');
const st = stage3d(document.getElementById('gl'), { dpr: FX.mobile ? 1.5 : 2 });
const stx = document.getElementById('stx');
if (!st) document.getElementById('flat').hidden = false;
else {
  const ws = wallScene(st, { keyPos: [1.7, 2.0, 3.8], shadowRadius: 9, wallZ: -0.45 });
  ws.scene.environment = st.envRT.texture;
  const P = pMesh(st, 'gunmetal', 1, 0.22, 0.022);
  const g = new THREE.Group(); g.add(P); ws.scene.add(g);
  accentEdges([st.MAT.edge], 0.35);
  const cam = ws.camera; let ry = 0, rx = 0, lx = 0, ly = 0;
  FX.loop((dt, t, now, live) => {
    st.size(); cam.aspect = st.aspect();
    fitCamera(cam, P.userData.width, 1, cam.aspect, innerWidth < 700 ? 0.48 : 0.42, 0.02); cam.updateProjectionMatrix();
    const p = sc.p;
    /* scroll: a full turn (0 -> 0.7), a lean back, then home to face you */
    const turn = FX.ease(p / 0.7) * Math.PI * 2, back = Math.sin(FX.clamp((p - 0.62) / 0.38, 0, 1) * Math.PI) * 0.35;
    ry = FX.damp(ry, turn, 3, dt); rx = FX.damp(rx, -back, 3, dt);
    const Pn = FX.pointer, on = Pn.inside && !FX.rm;
    lx = FX.damp(lx, on ? Pn.nx * 0.32 : 0, 3, dt); ly = FX.damp(ly, on ? Pn.ny * 0.2 : 0, 3, dt);
    const idle = FX.rm ? 0 : Math.sin(t * 0.6) * 0.05;
    g.rotation.set(rx + ly + idle * 0.4, ry + lx + idle, 0);
    g.position.z = 0.28 + (FX.rm ? 0 : Math.sin(t * 0.8) * 0.015);
    st.draw(ws.scene, cam);
    stx.style.opacity = (1 - FX.ss(0.01, 0.06, p)).toFixed(3);
    return Math.abs(ry - turn) > 1e-4 || Math.abs(lx - (on ? Pn.nx * 0.32 : 0)) > 1e-4;
  });
  window.__fx3d = { st };
}
</script>
</body>
</html>
