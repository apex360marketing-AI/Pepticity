<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PEPTICITY · EIGHT HONEYCOMBS</title>
<style>
@font-face{font-family:"PEPTICITY BLACK";src:url("brand/font/PepticityBlack.woff2") format("woff2")}
:root{--bg:#0b0b0c;--ink:#eceff3;--muted:#959ca6;--line:rgba(230,233,237,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,sans-serif}
h1,h2,.k{font-family:"PEPTICITY BLACK",system-ui;font-weight:400;text-transform:uppercase;letter-spacing:.06em;margin:0}
h1{font-size:clamp(22px,3vw,34px)} h2{font-size:clamp(15px,1.5vw,20px)}
.k{font-size:11px;letter-spacing:.3em;color:var(--muted)}
.wrap{width:min(1240px,100% - 32px);margin:0 auto;padding:40px 0 60px;display:grid;gap:28px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cell{display:grid;gap:6px;padding:12px;box-shadow:inset 0 0 0 1px var(--line);align-content:start}
.slot{aspect-ratio:1/1;width:100%}
.hex{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;letter-spacing:.08em}
.hex i{width:10px;height:10px;display:inline-block;background:var(--c);box-shadow:0 0 10px var(--c)}
p{margin:0;color:#c4cad2;font-size:14px}
@media (max-width:760px){.row{grid-template-columns:1fr}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="gl" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1"></canvas>
<div class="wrap">
  <div><p class="k">8 COMPLETELY DIFFERENT DESIGNS · SAMPLES ONLY · NOTHING ON THE SITE HAS CHANGED</p><h1>EIGHT HONEYCOMBS</h1>
    <p>The only things they share: the honeycomb (hexagon) shape and the new P. Each one has its own build, its own material, its own colour, its own light and its own spin.</p></div>
  <div class="row" id="row"></div>
</div>
<script type="module">
const D = [
  ['01 · THE MONOLITH', '#d4ff3a', 'One thick matte-black hexagon block, a thin neon inner hexagon, the P raised big in the middle.', 'Neon edge lines that slowly breathe.', 'Swings gently left and right like a pendulum.'],
  ['02 · NESTED FRAMES', '#0066FF', 'Three open chrome hexagon frames floating one behind the other. No plate: you see straight through.', 'Blue backlight glowing through the frames.', 'Each frame turns on its own, in opposite directions.'],
  ['03 · GLASS HIVE', '#0FFFFF', 'Seven honeycomb cells: six frosted-glass cells round one solid cell holding the P.', 'Ice-cyan light lines inside the glass.', 'The six glass cells orbit slowly round the P.'],
  ['04 · CHROME GEM', '#FF004F', 'A cut-gem chrome hexagon with big angled facets, a black hexagon set in the middle.', 'Red light from underneath, catching the facets.', 'A slow figure-eight wobble.'],
  ['05 · THE ZIGGURAT', '#6F00FF', 'Three hexagon steps stacked like a temple, PEPTICITY on the bottom step, the P on top.', 'Each step’s riser glows ultraviolet, in turn.', 'Turns slowly on its base, seen from above.'],
  ['06 · RELIEF FIELD', '#8D029B', 'A field of small honeycomb cells at different heights, one big cell rising from the centre with the P.', 'Magenta light glowing up between the cells.', 'The cells ripple; the whole field tilts to your mouse or finger.'],
  ['07 · THE FLIP', '#C46210', 'A thin hexagon coin: the P on the front, PEPTICITY on the back.', 'A copper light sweeps across it.', 'Flips all the way round, front then back.'],
  ['08 · HALO', '#FA8072', 'Just the P floating, with two thin hexagons of light behind it, one inside the other.', 'The hexagons are the light.', 'The two halos turn like a gyroscope; the P stays almost still.']];
const row = document.getElementById('row');
D.forEach(([n, c, b, l, s]) => { const d = document.createElement('div'); d.className = 'cell';
  d.innerHTML = `<div class="slot" data-i></div><h2>${n}</h2><span class="hex" style="--c:${c}"><i></i>${c}</span><p>BUILD · ${b}</p><p>LIGHT · ${l}</p><p>SPIN · ${s}</p>`; row.appendChild(d); });

const glyphs = await fetch('brand/font/glyphs.json').then(r => r.json());
const base = glyphs.regular.P, dxP = 1.15 * 700 - (684.5 - 45), mv = ([x, y]) => [x > 300 ? x + dxP : x, y];
glyphs.np = { P: { adv: base.adv + dxP, p: base.p.map(q => ({ o: q.o.map(mv), h: q.h.map(h => h.map(mv)) })) } };
const tag = document.createElement('script'); tag.type = 'application/json'; tag.id = 'glyph-data'; tag.textContent = JSON.stringify(glyphs); document.head.appendChild(tag);
const THREE = await import('three');
const { createStage, glyphGeometries, fitCamera } = await import('./brand/font/type3d-engine.js');
const stage = createStage(document.getElementById('gl')); const M = stage.MAT;
const W = new THREE.Color(0xffffff);

/* ---------- helpers ---------- */
const FLAT = 0, POINTY = Math.PI / 6;
const hexPts = (R, rot = FLAT) => [...Array(6)].map((_, i) => { const a = rot + i * Math.PI / 3; return new THREE.Vector2(R * Math.cos(a), R * Math.sin(a)); });
const slab = (R, d, { rot = FLAT, bv = 0.02, seg = 1 } = {}) => new THREE.ExtrudeGeometry(new THREE.Shape(hexPts(R, rot)), { depth: d, bevelEnabled: bv > 0, bevelThickness: bv, bevelSize: bv, bevelOffset: -bv, bevelSegments: seg });
const ring = (R1, R0, d, { rot = FLAT, bv = 0.01 } = {}) => { const s = new THREE.Shape(hexPts(R1, rot)); s.holes.push(new THREE.Path(hexPts(R0, rot).reverse()));
  return new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: bv > 0, bevelThickness: bv, bevelSize: bv, bevelOffset: -bv, bevelSegments: 1 }); };
const lines = (geo, mat, a = 25) => new THREE.LineSegments(new THREE.EdgesGeometry(geo, a), mat);
const edgeMat = (c, o = 0.8) => new THREE.LineBasicMaterial({ color: new THREE.Color(c).lerp(W, 0.25), transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false });
const tintSides = (c, e = 0.04) => { const m = M.uv.clone(); m.emissive = new THREE.Color(c); m.emissiveIntensity = e; m.sheenColor = new THREE.Color(c).lerp(new THREE.Color(0x0e0c14), 0.4); return m; };
const matte = () => new THREE.MeshPhysicalMaterial({ color: 0x141416, metalness: 0.35, roughness: 0.62, clearcoat: 0.2, clearcoatRoughness: 0.7, envMapIntensity: 0.5 });
function P3(depth, scale, face, side, edge) {
  const geo = glyphGeometries('np', 'P', { depth, bevel: depth * 0.1 }); const g = new THREE.Group(), inn = new THREE.Group(); g.add(inn); let a = Infinity, b = -Infinity;
  geo.parts.forEach(p => { p.g.computeBoundingBox(); a = Math.min(a, p.g.boundingBox.min.x); b = Math.max(b, p.g.boundingBox.max.x);
    inn.add(new THREE.Mesh(p.g, [face, side])); if (edge) inn.add(new THREE.LineSegments(p.lg, edge)); });
  inn.position.set(-(a + b) / 2, -0.35, 0); g.scale.set(scale, scale, 1); return g; }
function word(text, s, depth, face, side, edge, track = 0.06) {
  const g = new THREE.Group(), inn = new THREE.Group(); g.add(inn); let x = 0;
  [...text].forEach(ch => { const geo = glyphGeometries('regular', ch, { depth, bevel: Math.min(0.02, depth * 0.15) }); if (!geo) { x += 0.3; return; }
    const o = new THREE.Group(); geo.parts.forEach(p => { o.add(new THREE.Mesh(p.g, [face, side])); if (edge) o.add(new THREE.LineSegments(p.lg, edge)); });
    o.position.x = x; inn.add(o); x += geo.adv + track; });
  inn.position.set(-(x - track) / 2, -0.35, 0); g.scale.set(s, s, 1); return g; }
const glowTex = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 256; const x = cv.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,.28)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(cv); })();
const glow = (c, s, o) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false })); sp.scale.set(s, s, 1); return sp; };
const pt = (c, i, d, x, y, z) => { const l = new THREE.PointLight(c, i, d, 2); l.position.set(x, y, z); return l; };
const sw = (t, f) => Math.sin(t * f);

/* ---------- the eight designs ---------- */
const BUILD = [
  /* 01 MONOLITH */ (S, c) => {
    const g = new THREE.Group(), e = edgeMat(c, 0.9), blk = matte(), sd = tintSides(c, 0.02);
    const body = slab(1, 0.36, { rot: POINTY, bv: 0.05 }); body.translate(0, 0, -0.36); g.add(new THREE.Mesh(body, [blk, sd])); g.add(lines(body, e, 30));
    const inner = ring(0.74, 0.71, 0.02, { rot: POINTY, bv: 0 }); const neon = new THREE.MeshBasicMaterial({ color: c }); const nm = new THREE.Mesh(inner, neon); nm.position.z = 0.055; g.add(nm);
    const wd = word('PEPTICITY', 0.085, 0.04, M.gunmetal, M.uv, edgeMat(0xffffff, 0.4), 0.1); wd.position.set(0, -0.47, 0.05); g.add(wd);
    const P = P3(0.24, 0.98, M.gunmetal, tintSides(c, 0.03), edgeMat(0xffffff, 0.55)); P.position.set(0, 0.1, 0.05); P.scale.set(0.82, 0.82, 1); g.add(P);
    S.add(g); S.add(pt(c, 2.2, 5, -1.4, 1.2, 0.6)); S.add(pt(0xffffff, 1.2, 5, 1.5, 1.5, 1.2));
    return { fit: 2.3, update(t) { g.rotation.set(0.1, sw(t, 0.5) * 0.45, 0); const b = 0.5 + 0.5 * sw(t, 0.9); e.opacity = 0.55 + b * 0.4; neon.color.set(c).multiplyScalar(0.6 + b * 0.5); } }; },
  /* 02 NESTED FRAMES */ (S, c) => {
    const g = new THREE.Group(), e = edgeMat(c, 0.5), fr = [];
    [[1.0, 0.93, -0.34], [0.76, 0.7, -0.15], [0.54, 0.5, 0.02]].forEach(([a, b, z]) => { const geo = ring(a, b, 0.07); const m = new THREE.Group(); m.add(new THREE.Mesh(geo, [M.platinum, M.platinum])); m.add(lines(geo, e)); m.position.z = z; g.add(m); fr.push(m); });
    const P = P3(0.2, 0.7, M.gunmetal, tintSides(c, 0.12), edgeMat(c, 0.7)); P.position.z = 0.14; g.add(P);
    const wd = word('PEPTICITY', 0.1, 0.05, M.platinum, M.uv, null, 0.12); wd.position.set(0, -1.06, -0.3); g.add(wd);
    const h = glow(c, 3.6, 0.6); h.position.z = -0.9; S.add(h); S.add(pt(c, 5, 5, 0, 0, -0.8)); S.add(g);
    return { fit: 2.3, update(t) { fr[0].rotation.z = t * 0.12; fr[1].rotation.z = -t * 0.18; fr[2].rotation.z = t * 0.26; g.rotation.set(0.18, -0.25 + sw(t, 0.3) * 0.18, 0); } }; },
  /* 03 GLASS HIVE */ (S, c) => {
    const g = new THREE.Group(), orbit = new THREE.Group(), R = 0.33, d = Math.sqrt(3) * R * 1.06;
    const glass = new THREE.MeshPhysicalMaterial({ color: 0xdfe6ea, metalness: 0, roughness: 0.18, transparent: true, opacity: 0.16, clearcoat: 1, envMapIntensity: 1.2, depthWrite: false });
    const e = edgeMat(c, 0.85), cellG = slab(R, 0.14, { rot: POINTY, bv: 0.015 });
    for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; const m = new THREE.Group(); m.add(new THREE.Mesh(cellG, glass)); m.add(lines(cellG, e)); m.position.set(Math.cos(a) * d, Math.sin(a) * d, -0.07); orbit.add(m); }
    const core = slab(R, 0.2, { rot: POINTY, bv: 0.02 }); g.add(new THREE.Mesh(core, [matte(), tintSides(c, 0.05)])); g.add(lines(core, edgeMat(c, 0.6)));
    const P = P3(0.14, 0.42, M.platinum, tintSides(c, 0.1), null); P.position.set(0, 0.01, 0.22); g.add(P);
    g.add(orbit); const wd = word('PEPTICITY', 0.11, 0.05, M.platinum, tintSides(c, 0.05), null, 0.1); wd.position.set(0, -1.12, 0); g.add(wd); S.add(g); S.add(pt(c, 1.6, 4, 0, 0, 0.6)); const h = glow(c, 2.4, 0.12); h.position.z = -0.4; S.add(h);
    return { fit: 2.45, update(t) { orbit.rotation.z = t * 0.15; orbit.children.forEach(m => m.rotation.z = -t * 0.15); g.rotation.set(0.35, -0.3, 0); e.opacity = 0.6 + 0.3 * (0.5 + 0.5 * sw(t, 1.1)); } }; },
  /* 04 CHROME GEM */ (S, c) => {
    const g = new THREE.Group();
    const gem = new THREE.ExtrudeGeometry(new THREE.Shape(hexPts(0.82)), { depth: 0.08, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.18, bevelSegments: 1 }); gem.translate(0, 0, -0.04);
    const chrome = M.platinum.clone(); chrome.color.set(0x8f959d); chrome.roughness = 0.12; g.add(new THREE.Mesh(gem, chrome));
    const seat = slab(0.6, 0.06, { bv: 0.01 }); seat.translate(0, 0, 0.2); g.add(new THREE.Mesh(seat, [matte(), matte()])); g.add(lines(seat, edgeMat(c, 0.75)));
    const P = P3(0.18, 0.66, M.platinum, tintSides(c, 0.15), null); P.position.set(0, 0.07, 0.28); P.scale.set(0.56, 0.56, 1); g.add(P);
    const wd = word('PEPTICITY', 0.065, 0.03, M.platinum, M.uv, null, 0.1); wd.position.set(0, -0.32, 0.27); g.add(wd);
    S.add(g); S.add(pt(c, 6, 4, 0, -1.4, 0.8)); S.add(pt(c, 1.5, 4, 1.2, -0.5, 0.4));
    return { fit: 2.3, update(t) { g.rotation.set(0.15 + sw(t, 0.35) * 0.3, sw(t, 0.7) * 0.3, 0); } }; },
  /* 05 ZIGGURAT */ (S, c) => {
    const g = new THREE.Group(), risers = [];
    [[1.0, 0], [0.76, 0.14], [0.52, 0.28]].forEach(([R, z]) => { const geo = slab(R, 0.14, { bv: 0.012 }); const rs = tintSides(c, 0.03); risers.push(rs); const m = new THREE.Mesh(geo, [M.gunmetal, rs]); m.position.z = z; g.add(m); });
    const wd = word('PEPTICITY', 0.1, 0.05, M.platinum, M.uv, null, 0.08); wd.position.set(0, -0.77, 0.14); g.add(wd);
    const P = P3(0.18, 0.5, M.gunmetal, tintSides(c, 0.1), edgeMat(0xffffff, 0.5)); P.position.z = 0.42; g.add(P);
    S.add(g); S.add(pt(c, 1.2, 5, -1.5, -1, 1.2));
    return { fit: 2.3, update(t) { g.rotation.set(-0.85, 0, sw(t, 0.25) * 0.5); risers.forEach((m, k) => m.emissiveIntensity = 0.03 + Math.max(0, Math.sin(t * 1.2 - k * 1.1)) ** 2 * 0.28); } }; },
  /* 06 RELIEF FIELD */ (S, c) => {
    const g = new THREE.Group(), r = 0.13, cells = [];
    for (let q = -3; q <= 3; q++) for (let s = -3; s <= 3; s++) { const u = -q - s; if (Math.max(Math.abs(q), Math.abs(s), Math.abs(u)) > 3) continue; if (Math.max(Math.abs(q), Math.abs(s), Math.abs(u)) <= 1) continue;
      cells.push([Math.sqrt(3) * r * 1.08 * (q + s / 2), 1.5 * r * 1.08 * s]); }
    const cg = slab(r, 1, { rot: POINTY, bv: 0 }); const im = new THREE.InstancedMesh(cg, matte(), cells.length); g.add(im);
    const fl = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(hexPts(0.95, POINTY))), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.22 })); fl.position.z = -0.001; g.add(fl);
    const big = slab(0.4, 0.3, { rot: POINTY, bv: 0.02 }); g.add(new THREE.Mesh(big, [M.gunmetal, tintSides(c, 0.06)])); g.add(lines(big, edgeMat(c, 0.6)));
    const P = P3(0.12, 0.42, M.gunmetal, tintSides(c, 0.1), edgeMat(0xffffff, 0.5)); P.position.z = 0.33; g.add(P);
    const wd = word('PEPTICITY', 0.1, 0.05, M.platinum, M.uv, null, 0.12); wd.position.set(0, -1.1, 0.05); g.add(wd);
    S.add(g); S.add(pt(c, 1.4, 4, 1, 1, 0.8)); const st = { x: 0, y: 0 }, m4 = new THREE.Matrix4();
    return { fit: 2.45, update(t, prog, ptr, dt) { const k = 1 - Math.exp(-3 * dt); st.x += (ptr.y * 0.3 - st.x) * k; st.y += (ptr.x * 0.4 - st.y) * k;
      cells.forEach(([x, y], n) => { const h = 0.05 + 0.07 * (0.5 + 0.5 * Math.sin(t * 1.3 - Math.hypot(x, y) * 7)); m4.makeScale(1, 1, h).setPosition(x, y, 0); im.setMatrixAt(n, m4); }); im.instanceMatrix.needsUpdate = true;
      g.rotation.set(0.4 + st.x, -0.2 + st.y, 0); } }; },
  /* 07 THE FLIP */ (S, c) => {
    const g = new THREE.Group(), e = edgeMat(c, 0.6);
    const coin = slab(0.9, 0.1, { rot: POINTY, bv: 0.015 }); coin.translate(0, 0, -0.05); g.add(new THREE.Mesh(coin, [matte(), M.platinum]));
    const rim = ring(0.9, 0.82, 0.04, { rot: POINTY }); const r1 = new THREE.Mesh(rim, [M.platinum, M.platinum]); r1.position.z = 0.05; g.add(r1); const r2 = r1.clone(); r2.position.z = -0.09; g.add(r2);
    g.add(lines(rim, e).translateZ(0.05));
    const P = P3(0.12, 0.72, M.gunmetal, tintSides(c, 0.06), edgeMat(0xffffff, 0.45)); P.position.set(0, 0.02, 0.05); g.add(P);
    const wd = word('PEPTICITY', 0.13, 0.06, M.gunmetal, tintSides(c, 0.06), edgeMat(0xffffff, 0.4)); wd.rotation.y = Math.PI; wd.position.z = -0.05; g.add(wd);
    const sp = new THREE.SpotLight(new THREE.Color(c).lerp(W, 0.3), 0, 9, 0.22, 0.5, 1.2); sp.position.set(-3, 1, 3); S.add(sp); S.add(sp.target); S.add(g);
    return { fit: 2.0, update(t) { g.rotation.set(0.08, t * 0.55, 0); const ph = (t % 4.5) / 4.5; sp.intensity = Math.sin(Math.min(1, ph * 1.5) * Math.PI) * 28; sp.position.x = -3 + ph * 1.5 * 6; sp.target.position.set(sp.position.x * 0.15, 0, 0); } }; },
  /* 08 HALO */ (S, c) => {
    const g = new THREE.Group(), lit = new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(1.2) });
    const h1 = new THREE.Mesh(ring(1.0, 0.975, 0.02, { rot: POINTY, bv: 0 }), lit), h2 = new THREE.Mesh(ring(0.74, 0.72, 0.02, { rot: FLAT, bv: 0 }), lit);
    const halos = new THREE.Group(); halos.add(h1, h2); halos.position.z = -0.35; g.add(halos);
    const P = P3(0.24, 0.82, M.gunmetal, tintSides(c, 0.05), edgeMat(c, 0.5)); P.position.set(0, 0.08, 0); g.add(P);
    const wd = word('PEPTICITY', 0.075, 0.04, M.platinum, M.uv, null, 0.14); wd.position.set(0, -0.42, 0); g.add(wd);
    const gl = glow(c, 2.4, 0.18); gl.position.z = -0.5; S.add(gl); S.add(pt(c, 3, 4, 0, 0.2, -0.6)); S.add(g);
    return { fit: 2.3, update(t) { h1.rotation.y = t * 0.35; h2.rotation.x = t * 0.45; P.rotation.y = sw(t, 0.4) * 0.12; P.position.z = Math.abs(sw(t, 0.4)) * 0.06; g.rotation.x = 0.06; } }; },
];

document.querySelectorAll('[data-i]').forEach((el, i) => {
  const c = D[i][1], scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(26, 1, 0.1, 80);
  const key = new THREE.DirectionalLight(0xffffff, 1.45); key.position.set(2.2, 2.8, 4); scene.add(key);
  scene.add(new THREE.HemisphereLight(0xeef1f6, 0x0c0a12, 0.42));
  const d = BUILD[i](scene, c);
  stage.addSlot(el, { scene, camera, fit: a => fitCamera(camera, d.fit, d.fit, a, 0.88), update(dt, t, prog, ptr) { d.update(t, prog, ptr, dt); } });
});
window.__hive = true;
</script>
</body>
</html>
