<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><meta name="claude:viewport-fit-sides" content="cover">
<title>PEPTICITY Review</title>
<style>
:root{--bg:#26272a;--bg2:#313235;--ink:#ecebe6;--dim:#a9a8a1;--edge:rgba(255,255,255,.16);--lime:#d4ff3a;--pur:#c03bff;--bad:#ff6b7a;--ok:#9bd3ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#45464b,#2c2d30 55%,#262729) fixed;color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding-block:26px 190px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
h1,h2{text-transform:uppercase;letter-spacing:.08em;margin:0;text-wrap:balance}h1{font-size:clamp(22px,4vw,32px)}
.lede{color:var(--dim);margin:8px 0 18px}.lede b{color:var(--ink)}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid var(--edge);padding:18px 18px 14px;margin-bottom:18px;
 clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);transition:border-color .25s}
.card[data-done="1"]{border-color:rgba(212,255,58,.55)}
.card h2{font-size:18px;display:flex;gap:10px;align-items:baseline}.n{color:var(--lime);font-size:13px}
.ask{color:var(--dim);margin:6px 0 12px;min-width:0;overflow-wrap:anywhere}.st{position:absolute;top:14px;right:16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}.card[data-done="1"] .st{color:var(--lime)}
.pic{width:100%;max-width:100%;display:block;border:1px solid var(--edge);margin:6px 0 12px;cursor:zoom-in;position:relative}
.pw{position:relative}.tag{position:absolute;top:14px;left:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;background:rgba(20,20,22,.85);border:1px solid var(--edge)}
.tag.a{color:var(--lime);border-color:var(--lime)}.tag.c{color:var(--pur);border-color:var(--pur)}.tag.r{color:var(--bad);border-color:var(--bad)}
.hint{color:var(--dim);font-size:13px;margin:-4px 0 10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:8px 0 12px}
.th{background:rgba(255,255,255,.04);border:1px solid var(--edge);padding:8px;cursor:zoom-in;text-align:center;font:inherit;color:inherit;position:relative;transition:border-color .2s,transform .2s;min-width:0;
 clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.th:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.4)}.th img{width:100%;display:block;margin-bottom:6px}.th b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.08em}.th small{color:var(--dim);font-size:12px}
.th[data-v="a"]{border-color:var(--lime)}.th[data-v="c"]{border-color:var(--pur)}.th[data-v="r"]{border-color:var(--bad)}
.th .mk{position:absolute;top:10px;right:10px;font-size:11px;letter-spacing:.1em;padding:2px 8px;background:rgba(20,20,22,.88);border:1px solid var(--edge)}
.row{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);cursor:pointer;background:rgba(255,255,255,.07);border:1px solid var(--edge);min-height:46px;padding:0 16px;transition:background .2s,border-color .2s,transform .15s,color .2s;
 clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
button:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);transform:translateY(-1px)}button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.opt[aria-pressed="true"]{border-color:var(--lime);color:var(--lime);background:rgba(212,255,58,.12)}
ul.l{margin:6px 0 12px;padding-left:20px}ul.l li{margin:3px 0}a{color:var(--lime)}
textarea{width:100%;min-height:64px;margin-top:10px;font:inherit;color:var(--pur);background:rgba(0,0,0,.22);border:1px solid var(--edge);padding:10px;resize:vertical}textarea::placeholder{color:#8d8c86}
.mic.live{border-color:var(--pur);color:var(--pur);animation:p 1.1s infinite}@keyframes p{50%{box-shadow:0 0 0 6px rgba(192,59,255,.18)}}
.run{border:1px dashed var(--edge);padding:12px 16px;color:var(--dim);margin:6px 0 20px}.run b{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(38,39,41,.9);backdrop-filter:blur(14px);border-top:1px solid var(--edge);z-index:20}
.bar .row{max-width:1100px;margin:auto;justify-content:space-between;align-items:center}.count{color:var(--dim);font-size:14px}.primary{border-color:var(--lime);color:var(--lime)}
#saved{color:var(--dim);font-size:13px}#saved.ok{color:var(--lime)}
#out{display:none;margin-top:16px}#out textarea{color:var(--ink);min-height:160px}
#md{position:fixed;inset:0;background:#0e0e10;display:none;z-index:50;overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mbox{max-width:1200px;margin:0 auto;display:grid;gap:12px}.mt{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.mt b{text-transform:uppercase;letter-spacing:.08em}
.stage{position:relative;line-height:0;border:1px solid var(--edge);cursor:crosshair;justify-self:center;max-width:100%}.stage img{max-width:100%;max-height:68vh;display:block}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(192,59,255,.9);border:2px solid #fff;color:#fff;font:700 13px/22px system-ui;text-align:center;pointer-events:none}
.vb button[aria-pressed="true"].a{border-color:var(--lime);color:var(--lime);background:rgba(212,255,58,.14)}
.vb button[aria-pressed="true"].c{border-color:var(--pur);color:var(--pur);background:rgba(192,59,255,.16)}
.vb button[aria-pressed="true"].r{border-color:var(--bad);color:var(--bad);background:rgba(255,107,122,.14)}
@media(max-width:640px){.st{position:static;display:block;margin-bottom:6px}.bar button{flex:1;padding:0 8px;font-size:12px}.bar .row{gap:8px}.count{width:100%;text-align:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="wrap">
<h1 id="ttl"></h1>
<p class="lede" id="intro"></p>
<div class="run" id="run" hidden></div>
<main id="list"></main>
<div id="out"><p style="color:var(--dim)">Copied. Paste it into the chat if Claude has not already seen it. (If it did not copy, select this text and copy it.)</p><textarea id="outText" readonly></textarea></div>
</div>
<div class="bar"><div class="row"><span class="count"><span id="count"></span> &middot; <span id="saved">saved on this device</span></span><div class="row"><button type="button" id="clear">CLEAR</button><button type="button" class="primary" id="copy">COPY MY ANSWERS</button></div></div></div>
<div id="md" role="dialog" aria-modal="true" aria-label="Review picture"><div class="mbox">
 <div class="mt"><b id="mtitle"></b><button type="button" id="mclose">DONE (ESC)</button></div>
 <p class="hint">Tap or click on the picture to drop a numbered pin on the exact spot you mean.</p>
 <div class="stage" id="stage"><img id="mimg" alt=""></div>
 <div class="row vb"><button type="button" class="a" data-v="a">APPROVE</button><button type="button" class="c" data-v="c">CHANGE</button><button type="button" class="r" data-v="r">REJECT</button><button type="button" id="pclear">CLEAR PINS</button></div>
 <div><textarea id="mnote" placeholder="Comment on this picture: type, or tap TALK" aria-label="Comment"></textarea><div class="row" style="margin-top:8px"><button type="button" class="mic" id="mtalk">TALK</button></div></div>
</div></div>

const list=$('list');
function render(){list.innerHTML='';SPEC.items.forEach((it,i)=>{const r=rec(it.id);const done=!!(r.pick||Object.values(r.imgs).some(x=>x.v));
 const el=document.createElement('section');el.className='card';el.dataset.done=done?'1':'0';
 el.innerHTML=`<span class="st">${done?'ANSWERED':'WAITING'}</span><h2><span class="n">${String(i+1).padStart(2,'0')}</span>${esc(it.title)}</h2><p class="ask">${esc(it.ask||'')}</p>`;
 if((it.images||[]).length)el.insertAdjacentHTML('beforeend','<p class="hint">Tap the picture to approve it, change it or comment on a spot.</p>');
 (it.images||[]).forEach((src,n)=>{const k='i-'+n,x=(r.imgs[k]||{});const w=document.createElement('div');w.className='pw';const g=document.createElement('img');g.className='pic';g.src=src;g.alt=it.title;g.loading='lazy';g.tabIndex=0;g.onclick=()=>openM(it,{k,src,label:it.title});g.onkeydown=e=>{if(e.key==='Enter')g.onclick()};w.append(g);
  if(x.v){const t=document.createElement('span');t.className='tag '+x.v;t.textContent=VW[x.v];w.append(t)}el.append(w)});
 if(it.lines){const u=document.createElement('ul');u.className='l';u.innerHTML=it.lines.map(l=>`<li>${esc(l)}</li>`).join('');el.append(u)}
 if(it.link){const p=document.createElement('p');p.innerHTML=`<a href="${esc(it.link)}" target="_blank" rel="noopener">Open the live page</a>`;el.append(p)}
 if(it.thumbs){el.insertAdjacentHTML('beforeend','<p class="hint">Tap a picture to look closer, then APPROVE the one you pick or comment on it.</p>');const t=document.createElement('div');t.className='thumbs';
  it.thumbs.forEach(th=>{const k='t-'+th.key,x=r.imgs[k]||{};const b=document.createElement('button');b.type='button';b.className='th';if(x.v)b.dataset.v=x.v;b.innerHTML=`${x.v?`<span class="mk">${VW[x.v]}</span>`:''}<img src="${th.img}" alt=""><b>${esc(th.label)}</b>${th.sub?`<small>${esc(th.sub)}</small>`:''}`;b.onclick=()=>openM(it,{k,src:th.img,label:th.label,pickKey:th.key});t.append(b)});el.append(t)}
 if(it.options){const row=document.createElement('div');row.className='row';it.options.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=o.label;b.setAttribute('aria-pressed',r.pick===o.key);b.onclick=()=>{r.pick=r.pick===o.key?'':o.key;queue(it);render()};row.append(b)});el.append(row)}
 const ta=document.createElement('textarea');ta.placeholder='Optional note for this whole card: type, or tap TALK';ta.value=r.note||'';ta.setAttribute('aria-label','Note for '+it.title);ta.oninput=()=>{r.note=ta.value;queue(it)};
 const mic=document.createElement('button');mic.type='button';mic.className='mic';mic.textContent='TALK';mic.style.marginTop='8px';mic.onclick=()=>talk(ta,mic);el.append(ta,mic);list.append(el)});tally()}
function talk(ta,mic){if(!SR){ta.focus();return}const rc=new SR();rc.lang='en-CA';rc.interimResults=false;mic.classList.add('live');rc.onresult=e=>{ta.value=(ta.value?ta.value+' ':'')+e.results[0][0].transcript;ta.dispatchEvent(new Event('input'))};rc.onend=rc.onerror=()=>mic.classList.remove('live');rc.start()}
function tally(){const d=SPEC.items.filter(it=>{const r=S[it.id];return r&&(r.pick||Object.values(r.imgs||{}).some(x=>x.v))}).length;$('count').textContent=d+' of '+SPEC.items.length+' answered'}
/* ---- picture dialog: click the picture, approve / change / reject, pin a spot, comment ---- */
let cur=null;
function pins(){const st=$('stage');st.querySelectorAll('.pin').forEach(p=>p.remove());const x=ir(cur.it.id,cur.e.k);(x.pins||[]).forEach((p,n)=>{const d=document.createElement('span');d.className='pin';d.style.left=p[0]+'%';d.style.top=p[1]+'%';d.textContent=n+1;st.append(d)})}
function mset(){const x=ir(cur.it.id,cur.e.k);document.querySelectorAll('.vb button[data-v]').forEach(b=>b.setAttribute('aria-pressed',x.v===b.dataset.v));$('mnote').value=x.c||'';pins()}
function openM(it,e){cur={it,e};$('mtitle').textContent=e.label;$('mimg').src=e.src;$('md').style.display='block';mset();$('mclose').focus()}
function closeM(){$('md').style.display='none';if(cur){const it=cur.it;cur=null;queue(it);render()}}
$('mclose').onclick=closeM;addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)closeM()});
$('stage').onclick=ev=>{if(!cur)return;const im=$('mimg').getBoundingClientRect();const x=Math.round((ev.clientX-im.left)/im.width*100),y=Math.round((ev.clientY-im.top)/im.height*100);if(x<0||x>100||y<0||y>100)return;const r=ir(cur.it.id,cur.e.k);r.pins.push([x,y]);pins();queue(cur.it)};
document.querySelectorAll('.vb button[data-v]').forEach(b=>b.onclick=()=>{const r=ir(cur.it.id,cur.e.k);r.v=r.v===b.dataset.v?'':b.dataset.v;if(cur.e.pickKey!==undefined){const rr=rec(cur.it.id);if(r.v==='a')rr.pick=cur.e.pickKey;else if(rr.pick===cur.e.pickKey)rr.pick=''}mset();queue(cur.it)});
$('pclear').onclick=()=>{ir(cur.it.id,cur.e.k).pins=[];pins();queue(cur.it)};
$('mnote').oninput=()=>{ir(cur.it.id,cur.e.k).c=$('mnote').value;queue(cur.it)};$('mtalk').onclick=()=>talk($('mnote'),$('mtalk'));
$('clear').onclick=()=>{if(!window.__sure){window.__sure=1;$('clear').textContent='TAP AGAIN TO CLEAR';setTimeout(()=>{window.__sure=0;$('clear').textContent='CLEAR'},3000);return}window.__sure=0;$('clear').textContent='CLEAR';S={};persist();render();SPEC.items.forEach(queue)};
$('copy').onclick=async()=>{const L=[SPEC.title.toUpperCase()+' ANSWERS:'];SPEC.items.forEach((it,i)=>{const r=S[it.id]||{imgs:{}};
 L.push(String(i+1).padStart(2,'0')+' '+it.title+': '+(r.pick?labelFor(it,r.pick):'(no choice, hold)')+(r.note&&r.note.trim()?' | note: '+r.note.trim():''));
 entries(it).forEach(e=>{const x=(r.imgs||{})[e.k];if(x&&(x.v||x.c||(x.pins||[]).length))L.push('    - '+e.label+': '+(VW[x.v]||'no verdict')+((x.pins||[]).length?' | pins at '+x.pins.map((p,n)=>(n+1)+'=('+p[0]+'%,'+p[1]+'%)').join(' '):'')+(x.c&&x.c.trim()?' | '+x.c.trim():''))})});
 const t=L.join('\n');$('outText').value=t;$('out').style.display='block';try{await navigator.clipboard.writeText(t)}catch(e){$('outText').select()}$('out').scrollIntoView({behavior:'smooth',block:'center'})};
render();
</script>
</body></html>
