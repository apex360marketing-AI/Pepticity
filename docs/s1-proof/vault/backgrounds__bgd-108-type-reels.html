<title>TYPE REELS · BGD-108 · APEX Backgrounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
.apx-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;isolation:isolate;

             radial-gradient(60% 50% at 18% 85%,color-mix(in oklab,var(--apx-accent,#9fc3ff) 7%,transparent),transparent 70%),
             var(--apx-bg,#0b0d12)}
.apx-bg__cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  --fd:"Syncopate","Hanken Grotesk",system-ui,sans-serif;--ft:"Hanken Grotesk",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --apx-font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--ink);font:400 16px/1.55 var(--ft)}
.mono{font-family:var(--fm);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
/* pinned stage, as in the source page (section.bgsec + sticky .stage) */
.bgsec{position:relative;height:340vh}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;background:#0b0d12}
.bgx{position:absolute;inset:0}
.hint{position:absolute;left:14px;bottom:12px;z-index:2;color:var(--ink-2);font-size:10px;text-shadow:0 1px 8px rgba(0,0,0,.8);pointer-events:none}
.hint b{color:var(--spark);font-weight:600}
</style></head>
