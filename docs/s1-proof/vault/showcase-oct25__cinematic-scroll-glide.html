<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinematic Scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..600&family=Azeret+Mono:wght@400..600&display=swap">
<style>
:root{
  --ink:#0b0b0c;         /* ground: matte black, faint cool bias */
  --ink-2:#121315;       /* raised surface */
  --ink-3:#1b1c1f;       /* control surface */
  --line:rgba(232,229,222,.11);
  --line-2:rgba(232,229,222,.22);
  --bone:#ebe7df;        /* primary text */
  --ash:#a29f99;         /* secondary text */
  --mute:#99958e;        /* tertiary (keeps 6:1 on the ground) */
  --plat:#cfd3d9;        /* platinum accent: chrome, focus, live signals */
  --glow:rgba(214,224,238,.55);
  --glass:rgba(24,25,28,.62);
  --f-disp:"Gloock","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-text:"Schibsted Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"Azeret Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{margin:0;height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:#04050a;color:var(--bone);font:400 16px/1.6 var(--f-text);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plat);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em}
.eyebrow{font:500 11.5px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ash)}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
/* ---------- cinematic scroll + preloader ---------- */
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
.sprog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;z-index:60;pointer-events:none;transform-origin:0 50%;transform:scaleX(var(--p,0));background:#d4ff3a;box-shadow:0 0 10px rgba(212,255,58,.6)}

.hero .in>div:first-child{translate:0 calc(var(--sy,0) * -.05px)}
.trio{translate:0 calc(var(--sy,0) * .09px)}
.still .hero .in>div:first-child,.still .trio{translate:none}
.hero h1{font-size:clamp(46px,6.6vw,104px);line-height:.98;margin-top:22px}
.hero h1 em{font-style:normal;color:var(--plat);text-shadow:0 0 34px rgba(214,224,238,.25)}
.hero h1 .w{display:inline-block;animation:rise 1.1s var(--ease) both;animation-delay:calc(var(--i) * 70ms + 120ms)}
@keyframes rise{from{transform:translateY(.45em);opacity:.0;filter:blur(6px)}}
.lede{max-width:34em;color:var(--ash);font-size:clamp(17px,1.35vw,19px);margin:26px 0 0}
.lede b{color:var(--bone);font-weight:600}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.demo{min-height:100%;display:grid;place-items:center;align-content:center;gap:16px;padding:24px}
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px;padding:24px}
.hero h1{font-size:clamp(30px,6vw,80px);line-height:.98;margin:0}
.trio{height:220px;background:radial-gradient(closest-side,rgba(207,211,217,.18),transparent 70%);border-radius:50%}
.trio{translate:0 calc(var(--sy,0) * .09px)}
.sec{min-height:80vh;padding:40px 24px;border-top:1px solid var(--line)}
.sec h2{font-size:clamp(26px,5vw,56px)}
.hint{position:fixed;right:10px;bottom:10px;font:500 11px/1 var(--f-mono);letter-spacing:.14em;color:var(--mute);z-index:5}
/* ---------- motion off ---------- */
.still *,.still *::before,.still *::after{animation:none!important;transition-duration:.01s!important;scroll-behavior:auto!important}
.still .trio .t{transform:translate3d(var(--x),var(--y),var(--z)) rotateY(calc(var(--r) * -1.2)) rotateZ(calc(var(--r) * .35))}
</style>
</head>
<body>
<div class="sprog" aria-hidden="true"></div><section class="hero"><div class="in"><div><p class="eyebrow">What we can build</p><h1>Websites that <em>move</em>.</h1></div></div><div class="trio" aria-hidden="true"></div></section><section class="sec"><p class="eyebrow">Section 1</p><h2>Smooth, weighted glide.</h2></section><section class="sec"><p class="eyebrow">Section 2</p><h2>Smooth, weighted glide.</h2></section><section class="sec"><p class="eyebrow">Section 3</p><h2>Smooth, weighted glide.</h2></section><section class="sec"><p class="eyebrow">Section 4</p><h2>Smooth, weighted glide.</h2></section><div class="hint">SCROLL &darr;</div>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script>(()=>{const $=(s,r=document)=>r.querySelector(s);const prm=matchMedia("(prefers-reduced-motion: reduce)");let motion=!prm.matches;
let lenis = null, rafId = 0;
const sprog = $('.sprog'), rootEl = document.documentElement;
function overlayOpen() { return !!document.querySelector('.ov:not([hidden]), .tray:not([hidden])'); }
function onScrollFx(y) {
  const max = Math.max(1, rootEl.scrollHeight - innerHeight);
  sprog.style.setProperty('--p', Math.min(1, y / max).toFixed(4));
  if (y < 1400) rootEl.style.setProperty('--sy', y.toFixed(1));
}
function startLenis() {
  if (lenis || !window.Lenis || !motion || prm.matches) return;
  lenis = new Lenis({ lerp: .085, wheelMultiplier: .95, smoothWheel: true, anchors: { offset: -70 } });
  lenis.on('scroll', e => onScrollFx(e.scroll));
  const loop = t => { lenis.raf(t); rafId = requestAnimationFrame(loop); };
  rafId = requestAnimationFrame(loop);
  if (overlayOpen()) lenis.stop();
}
function stopLenis() { if (!lenis) return; cancelAnimationFrame(rafId); lenis.destroy(); lenis = null; }
addEventListener('scroll', () => { if (!lenis) onScrollFx(scrollY); }, { passive: true });
onScrollFx(scrollY);
const mo = new MutationObserver(() => { if (!lenis) return; overlayOpen() ? lenis.stop() : lenis.start(); });
['stage', 'cmp', 'tray'].forEach(id => { const el = document.getElementById(id); if (el) mo.observe(el, { attributes: true, attributeFilter: ['hidden'] }); });
startLenis();})();</script>
</body>
</html>
