<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MERCURY BEADS · BGD-113 · APEX Backgrounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
.apx-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;isolation:isolate;
  background:radial-gradient(70% 60% at 72% 18%,color-mix(in oklab,var(--apx-accent,#9fc3ff) 12%,transparent),transparent 70%),
             radial-gradient(60% 50% at 18% 85%,color-mix(in oklab,var(--apx-accent,#9fc3ff) 7%,transparent),transparent 70%),
             var(--apx-bg,#0b0d12)}
.apx-bg__cv{position:absolute;inset:0;width:100%;height:100%;display:block}
:root{--void:#0b0d12;--ink:#eef1f5;--ink-2:#c9d0d9;--muted:#a3acb7;--dim:#6b7380;--spark:#d4ff3a;
  --fd:"Syncopate","Hanken Grotesk",system-ui,sans-serif;--ft:"Hanken Grotesk",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --apx-font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--ink);font:400 16px/1.55 var(--ft)}
.mono{font-family:var(--fm);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
/* pinned stage, as in the source page (section.bgsec + sticky .stage) */
.bgsec{position:relative;height:340vh}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;background:#0b0d12}
.bgx{position:absolute;inset:0}
.hint{position:absolute;left:14px;bottom:12px;z-index:2;color:var(--ink-2);font-size:10px;text-shadow:0 1px 8px rgba(0,0,0,.8);pointer-events:none}
.hint b{color:var(--spark);font-weight:600}
</style></head>
<body>
<section class="bgsec" id="BGD-113" data-code="BGD-113" data-apx-scope style="--acc:#d7e0ea">
 <div class="stage">
  <div class="bgx" data-bg="BGD-113"></div>
  <p class="mono hint"><b>BGD-113</b> · MERCURY BEADS · scroll ↓ · move the pointer</p>
 </div>
</section>

<script>
/*! BGD-113 · MERCURY BEADS — polished drops of liquid metal float in the dark, reflecting a soft studio. The pointer draws them in until they touch and melt together; scrolling flicks them, so they stretch into teardrops and pull apart. */

  var FS = [
    'precision highp float;',
    'uniform vec2 uR,uM;uniform float uT,uMI,uP,uV,uSO,uPx,uSt;uniform vec3 uBg,uAc,uInk;',
    'uniform vec3 uB[' + MAX + '];uniform float uN;',
    'vec3 env(vec3 R){',
    ' float y=R.y; float x=R.x;',
    ' float s=smoothstep(.55,.62,y)*smoothstep(.95,.8,y)*.95;',
    ' s+=smoothstep(.12,.18,y)*smoothstep(.34,.24,y)*.35;',
    ' s+=smoothstep(.7,.95,x+sin(uT*.2)*.1)*.45*smoothstep(-.4,.3,y);',
    ' vec3 c=mix(uBg*1.4,uInk,s);',
    ' c+=uAc*smoothstep(-.1,-.7,y)*.35;',
    ' c=mix(c,uBg*.6,smoothstep(-.2,-.9,y)*.6);',
    ' return c;}',
    'void main(){',
    ' vec2 fc=gl_FragCoord.xy; vec2 q=fc/uR; vec2 p=fc/uR.y;',
    ' float f=0.; vec2 gr=vec2(0.);',
    ' for(int i=0;i<' + MAX + ';i++){ if(float(i)>=uN) break; vec3 b=uB[i]; vec2 d=p-b.xy; d.y/=uSt; float d2=dot(d,d)+1e-5; float k=b.z*b.z/d2; f+=k; gr+=-2.*k/d2*vec2(d.x,d.y/uSt); }',

    ' float edge=.035*uPx/uR.y*900.;',
    ' float a=smoothstep(1.-edge,1.+edge,f);',
    ' if(a>0.){',
    '  float hh=sqrt(clamp(1.-1./f,0.,1.));',
    '  vec2 gh=gr/(f*f)/(2.*max(hh,.06));',

    '  R.xy+=(vec2(uM.x/uR.x,uM.y/uR.y)-.5)*.25*uMI;',
