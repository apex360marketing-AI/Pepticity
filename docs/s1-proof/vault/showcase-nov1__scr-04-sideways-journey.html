<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCR-04 Sideways Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#040507; --ink:#e9edf2; --ink-2:#c3cad3; --muted:#9ea7b1; --dim:#636b75; --spark:#d4ff3a;
  --rim:rgba(255,255,255,.16); --rim-2:rgba(255,255,255,.28); --scrim:rgba(4,5,7,.72);
  --glass-fill:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.012)),rgba(6,8,12,.34);
  --chrome:linear-gradient(100deg,#c9d0d8 0%,#f5f8fb 18%,#ffffff 30%,#9aa4af 46%,#f5f8fb 60%,#3b424b 78%,#f5f8fb 100%);
  --f-display:"Syncopate","Arial Black",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --step--1:clamp(.78rem,.74rem + .2vw,.86rem); --step-0:clamp(.95rem,.9rem + .25vw,1.06rem);
  --step-1:clamp(1.1rem,1rem + .5vw,1.35rem); --step-2:clamp(1.3rem,1.1rem + 1vw,1.9rem);
  --step-3:clamp(1.6rem,1.2rem + 2vw,2.9rem); --step-4:clamp(2rem,1.2rem + 4vw,4.6rem);
  --cut:26px; --gutter:max(16px,env(safe-area-inset-left,0px)); --rail:0px;
  --dur-1:140ms; --dur-2:240ms; --dur-3:420ms; --dur-4:700ms; --ease-out:cubic-bezier(.16,1,.3,1); --ease-io:cubic-bezier(.65,0,.35,1);
  color-scheme:dark;
}
@media (min-width:1100px){:root{--rail:84px}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#04050a;color:var(--ink);font:400 var(--step-0)/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}

.journey{position:relative}
.journey .stick{position:relative}
.track{display:flex;gap:clamp(18px,2.4vw,32px);overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 28px;scrollbar-width:thin}
.track::-webkit-scrollbar{height:6px}.track::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18)}
.site{flex:0 0 min(340px,82vw);scroll-snap-align:start;display:grid;gap:16px;align-content:start}
.jbar{display:flex;align-items:center;gap:14px;margin-top:8px}
.jbar .bar{flex:1;height:2px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.jbar .bar i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,rgba(255,255,255,.4),#fff);box-shadow:0 0 8px rgba(255,255,255,.5)}
.jbar .bar b{position:absolute;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--spark);left:calc(var(--p,0) * 100% - 3px);box-shadow:0 0 8px var(--spark)}
.journey-on .journey{height:var(--jh,300vh)}
.journey-on .journey .stick{position:sticky;top:64px;height:calc(100svh - 64px);display:grid;align-content:center;overflow:hidden}
.journey-on .site{flex-basis:clamp(220px,calc((100svh - 64px - 300px) * .513),330px)}
.journey-on .track{overflow:visible;scroll-snap-type:none;transform:translate3d(var(--jx,0px),0,0);will-change:transform;padding-bottom:12px}
.device{--rx:0deg;--ry:0deg;--gx:50%;--gy:30%;position:relative;perspective:900px;cursor:pointer;border:0;background:none;padding:0;text-align:left;display:block;width:100%}
.device .bezel{position:relative;aspect-ratio:390/760;border-radius:38px;padding:9px;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform var(--dur-3) var(--ease-out);
  background:linear-gradient(135deg,#f6f8fa,#9ea8b3 22%,#e8ecf0 40%,#5d6670 62%,#d9dee4 80%,#8a939d);box-shadow:0 30px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.6)}
.device .screen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:#000}
.device .screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.device .glare{position:absolute;inset:9px;border-radius:30px;pointer-events:none;background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.22),transparent 45%);mix-blend-mode:screen;opacity:.0;transition:opacity var(--dur-3)}
.device:hover .glare,.device:focus-visible .glare{opacity:1}
.device .notch{position:absolute;top:15px;left:50%;transform:translateX(-50%);width:30%;height:20px;border-radius:12px;background:#000;z-index:2}
.device .play{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:10px;padding:11px 16px;white-space:nowrap;
  font:700 .62rem/1 var(--f-display);letter-spacing:.16em;color:var(--ink);background:rgba(4,5,7,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px var(--rim-2);clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
.device .play i{width:7px;height:7px;border-radius:50%;background:var(--spark);box-shadow:0 0 10px var(--spark)}
.site .meta{display:grid;gap:8px}
.site .kind{font:500 .66rem/1.3 var(--f-mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.site .sig{font-size:var(--step--1);color:var(--ink-2)}
.site .fx{display:flex;flex-wrap:wrap;gap:6px}
.site .row{display:flex;gap:8px;flex-wrap:wrap}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{border-color:rgba(255,255,255,.62);color:var(--ink);background:rgba(255,255,255,.08)}
.chip[aria-pressed="true"]::before,.chip[aria-checked="true"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--spark);box-shadow:0 0 8px var(--spark)}
.code{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--ink-2);padding:3px 7px;border:1px solid var(--rim);white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:var(--step--1);letter-spacing:.06em}
.muted{color:var(--muted)}
h3{font-size:var(--step-1);letter-spacing:.08em}
.pad{padding:24px 18px}.pad h2{font-size:var(--step-2)}
.journey-on .journey .stick{top:0;height:100svh}
.journey-on .site{flex-basis:clamp(120px,calc((100svh - 160px) * .513),330px)}
.site .meta h3{font-size:.7rem}
.end{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}}
.still *,.still *::before,.still *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
</style>

</head>

<div class="end mono">END OF JOURNEY</div>
<script>
const $=(s,r=document)=>r.querySelector(s);const SITES={length:6};
const motionOn=!matchMedia('(prefers-reduced-motion: reduce)').matches;
/* HOV-41 tilt */
function tilt(dev){const b=dev.querySelector('.bezel');if(!b)return;
  dev.addEventListener('pointermove',e=>{if(!motionOn||e.pointerType!=='mouse')return;const r=dev.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    dev.style.setProperty('--ry',((x-.5)*14).toFixed(2)+'deg');dev.style.setProperty('--rx',((.5-y)*10).toFixed(2)+'deg');dev.style.setProperty('--gx',(x*100).toFixed(1)+'%');dev.style.setProperty('--gy',(y*100).toFixed(1)+'%')});
  dev.addEventListener('pointerleave',()=>{dev.style.setProperty('--rx','0deg');dev.style.setProperty('--ry','0deg')})}
document.querySelectorAll('.device').forEach(tilt);
/* SCR-04 Sideways Journey (original enables the pinned journey at min-width:900px; here always on so it reads in a small preview) */
function layoutJourney(){const root=document.documentElement,j=$('#journey'),t=$('#track');
  const on=motionOn;root.classList.toggle('journey-on',on);
  if(!on){t.style.removeProperty('--jx');return}
  const over=Math.max(0,t.scrollWidth-t.clientWidth+40);j.style.setProperty('--jh',(innerHeight+over)+'px');j.dataset.over=over;onJourney()}
function onJourney(){const j=$('#journey'),t=$('#track');let p=0;
  if(document.documentElement.classList.contains('journey-on')){const r=j.getBoundingClientRect();const over=+j.dataset.over||0;const span=Math.max(1,j.offsetHeight-innerHeight);
    p=Math.min(1,Math.max(0,(0-r.top)/span));t.style.setProperty('--jx',(-p*over).toFixed(1)+'px')}
  else{p=t.scrollLeft/Math.max(1,t.scrollWidth-t.clientWidth)}
  $('#jbar').style.setProperty('--p',p.toFixed(3));$('#jcount').textContent=String(Math.min(SITES.length,1+Math.round(p*(SITES.length-1)))).padStart(2,'0')+' / '+String(SITES.length).padStart(2,'0')}
$('#track').addEventListener('scroll',onJourney,{passive:true});
addEventListener('resize',layoutJourney);addEventListener('scroll',onJourney,{passive:true});
setTimeout(layoutJourney,60);addEventListener('load',layoutJourney);
</script>
