<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOIRÉ SILK · BGD-112 · APEX Backgrounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
.apx-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;isolation:isolate;
  background:radial-gradient(70% 60% at 72% 18%,color-mix(in oklab,var(--apx-accent,#9fc3ff) 12%,transparent),transparent 70%),
             radial-gradient(60% 50% at 18% 85%,color-mix(in oklab,var(--apx-accent,#9fc3ff) 7%,transparent),transparent 70%),
             var(--apx-bg,#0b0d12)}
.apx-bg__cv{position:absolute;inset:0;width:100%;height:100%;display:block}
:root{--void:#0b0d12;--ink:#eef1f5;--ink-2:#c9d0d9;--muted:#a3acb7;--dim:#6b7380;--spark:#d4ff3a;
  --fd:"Syncopate","Hanken Grotesk",system-ui,sans-serif;--ft:"Hanken Grotesk",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --apx-font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--ink);font:400 16px/1.55 var(--ft)}
.mono{font-family:var(--fm);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
/* pinned stage, as in the source page (section.bgsec + sticky .stage) */
.bgsec{position:relative;height:340vh}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;background:#0b0d12}
.bgx{position:absolute;inset:0}
.hint{position:absolute;left:14px;bottom:12px;z-index:2;color:var(--ink-2);font-size:10px;text-shadow:0 1px 8px rgba(0,0,0,.8);pointer-events:none}
.hint b{color:var(--spark);font-weight:600}
</style></head>
<body>
<section class="bgsec" id="BGD-112" data-code="BGD-112" data-apx-scope style="--acc:#e7a6c6">
 <div class="stage">
  <div class="bgx" data-bg="BGD-112"></div>
  <p class="mono hint"><b>BGD-112</b> · MOIRÉ SILK · scroll ↓ · move the pointer</p>
 </div>
</section>

<script>
/*! BGD-112 · MOIRÉ SILK — two veils of hair-fine lines laid over each other, like layered silk organza. Scrolling turns one veil against the other, so slow luminous moiré bands bloom, sweep and change scale; the pointer is a lens that bends the lines into rings. */
APX.bg.define('BGD-112', 'MOIRÉ SILK', { bg: '#0b0a0f', accent: '#e7a6c6', ink: '#efeaf2' }, function (A) {
  var FS = [
    'precision highp float;',
    'uniform vec2 uR,uM;uniform float uT,uMI,uP,uV,uSO,uPx,uRot;uniform vec3 uBg,uAc,uInk;',
    'void main(){',
    ' vec2 fc=gl_FragCoord.xy; vec2 q=fc/uR; vec2 c=uR*.5; vec2 p=fc-c;',
    ' float P=6.5*uPx;',
    ' float a1=.32+uT*.006;',
    ' float s1=dot(p,vec2(cos(a1),sin(a1)))/P + sin(p.y/(300.*uPx)+uT*.15)*.55;',
    ' float a2=a1+uRot;',
    ' vec2 dm=fc-uM; float r=length(dm)/uPx; float lens=exp(-r*r/(2.*170.*170.))*uMI;',
    ' float s2=dot(p,vec2(cos(a2),sin(a2)))/(P*1.018) + lens*(1.-exp(-r/90.))*6. + uSO*1.6 + sin(p.x/(340.*uPx)-uT*.11)*.55;',
    ' float g1=pow(.5+.5*cos(6.2831853*s1),6.);',
    ' float g2=pow(.5+.5*cos(6.2831853*s2),6.);',
    ' float beat=.5+.5*cos(6.2831853*(s1-s2));',
    ' float veil=smoothstep(.45,1.,beat);',
    ' vec3 col=uBg*1.12;',
    ' col+=uInk*(g1+g2)*.022;',
    ' col+=mix(uInk,uAc,.5)*g1*g2*.3;',
    ' col+=uAc*veil*.06+uInk*veil*.02;',
    ' col+=uAc*lens*.05;',
    ' col*=.74+.26*smoothstep(1.25,.15,length(q-.5));',
    ' gl_FragColor=vec4(col,1.);',
    '}'

  var g = A.gl(A.cv, FS); if (!g) return { failed: true };

    res: function (dpr) { return Math.min(dpr, 1.5); },
    frame: function (S) {
      var tgt = .012 + S.sp * .085 + S.sv * .01; rot += (tgt - rot) * Math.min(1, S.dt * 3);

</script>
